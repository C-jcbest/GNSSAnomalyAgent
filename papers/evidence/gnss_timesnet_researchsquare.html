ner noreferrer" class="tw-text-blue-600 hover:tw-text-blue-800 hover:tw-underline" data-track="click_reading_the_published_version" data-track-context="GPS Solutions" data-track-category="Published" data-track-link-text="Read the published version in GPS Solutions" data-track-content-type="Research Article" data-track-label="Springer Link"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-blue-50 hover:tw-bg-blue-100 tw-transition tw-block tw-w-full tw-text-center">Read the published version in<!-- --> <span class="tw-italic">GPS Solutions</span>  →</span></a></p></div><div class="tw-px-4 tw-border-t-2 tw-border-gray-100"><button type="button" class="tw-min-w-full focus:tw-outline-none tw-group"><div class="tw-flex tw-items-center tw-justify-between"><div class="tw-w-full tw-py-2"><div class="tw-text-left"><h3 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-base">Version <!-- -->1</h3><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-text-gray-700">posted<!-- --> </p></div></div><div class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-my-2 tw-flex tw-items-center tw-duration-300 tw-transform tw-bg-gray-100 group-hover:tw-bg-gray-200"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-text-gray-800 group-hover:tw-text-gray-900 tw-flex">8</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-text-gray-800 group-hover:tw-text-gray-900 tw-h-6 tw-w-6 tw-flex-shrink-0 tw-rounded-full tw-transform tw-duration-300 tw-ml-2"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button><div class="tw-pb-1"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-flex tw-justify-center tw-w-full tw-mb-2">You are reading this <!-- -->latest<!-- --> <!-- -->preprint<!-- --> version</span></p></div></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Abstract</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Time series anomaly detection is essential in a range of fields because it allows for the identification of atypical patterns that differ from the expected behavior. Time series data of GNSS coordinates of SIRGAS stations are valuable for research purposes, including the determination of tectonic drift (velocity) and strain rate deformation. Changes in the patterns of a GNSS time series at a station due to abnormal events such as earthquakes, equipment changes, or malfunctions can significantly impact the accuracy of velocity estimation. In this work, we assess the efficacy of a neural network called TimesNet for detecting anomalies in real GNSS time series data from 95 SIRGAS stations in Brazil and Ecuador. As TimesNet achieved state-of-the-art efficiency on many benchmark datasets, it was chosen as the primary model for this research. Hyperparameter optimization was employed for TimesNet using two stations: BRAZ, in a low seismic activity area in Brazil, and CHEC in a high seismic activity area in Ecuador. The results with both hyperparameters sets were compared against three established anomaly detection filters (Gaussian process, Kalman and Moving Average) and a LSTM neural network that were paired with three anomaly scorer methods (norm, K-means and difference). We tested two methods to predict labels from the anomaly scores: 1) Using a fixed percentile (Top 1%) threshold, and 2) Using the Top S scores, where S is the number of anomalies of each station. The TimesNet with hyperparameters optimized in the CHEC station obtained better results than BRAZ, both in Brazil and Ecuador stations, showing that the choice of hyperparameters may present an impact in the anomaly detection results. The best F1<sub>Top S</sub> and MSE in Brazil were obtained with the Kalman filter (F1<sub>Top S</sub>=57.60 | MSE&thinsp;=&thinsp;0.0094), closely followed by TimesNet (F1<sub>Top S</sub>=55.67 | MSE&thinsp;=&thinsp;0.0095). In Ecuador, the best F1<sub>Top S</sub> and MSE were obtained by TimesNet (F1<sub>Top S</sub>=63.64 | MSE&thinsp;=&thinsp;0.0145), followed by the Kalman filter (F1<sub>Top S</sub>=59.09 | MSE&thinsp;=&thinsp;0.0344). Therefore, the anomaly scores produced by TimesNet were less noisy than those produced by the other methods on Ecuador. To foster further research, the source code for this analysis is publicly available at <span class="ExternalRef"><span class="RefSource">https://github.com/mauriciodev/deep_anomaly_gnss</span><span address="https://github.com/mauriciodev/deep_anomaly_gnss" targettype="URL" class="RefTarget"></span></span>.</p></div></span></div><div class="tw-flex tw-flex-wrap tw-pb-3"><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">GNSS Time Series</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">Anomaly Detection</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">Deep Learning</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">TimesNet</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">Hyperparameter Optimization</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">Kalman</span></p></div></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Figures</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 rder-gray-100 tw-rounded-lg group-hover:tw-border-gray-200" style="color:transparent" srcSet="/_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-4460921%2Fv1%2F7d8d55b79e278c4c99b4fca7.jpg%3FmaxDims%3D150x150&amp;w=128&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-4460921%2Fv1%2F7d8d55b79e278c4c99b4fca7.jpg%3FmaxDims%3D150x150&amp;w=256&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-4460921%2Fv1%2F7d8d55b79e278c4c99b4fca7.jpg%3FmaxDims%3D150x150&amp;w=256&amp;q=75"/><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black group-hover:tw-underline">Figure 5</p></button><button class="tw-mb-4 tw-mr-4 focus:tw-outline-none tw-group" type="button" tabindex="5"><img alt="Figure 6" loading="lazy" width="100" height="100" decoding="async" data-nimg="1" class="tw-mb-2 tw-border-2 tw-border-gray-100 tw-rounded-lg group-hover:tw-border-gray-200" style="color:transparent" srcSet="/_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-4460921%2Fv1%2F09cfbe1dc21336396d1a240f.jpg%3FmaxDims%3D150x150&amp;w=128&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-4460921%2Fv1%2F09cfbe1dc21336396d1a240f.jpg%3FmaxDims%3D150x150&amp;w=256&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-4460921%2Fv1%2F09cfbe1dc21336396d1a240f.jpg%3FmaxDims%3D150x150&amp;w=256&amp;q=75"/><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black group-hover:tw-underline">Figure 6</p></button><button class="tw-mb-4 tw-mr-4 focus:tw-outline-none tw-group" type="button" tabindex="6"><img alt="Figure 7" loading="lazy" width="100" height="100" decoding="async" data-nimg="1" class="tw-mb-2 tw-border-2 tw-border-gray-100 tw-rounded-lg group-hover:tw-border-gray-200" style="color:transparent" srcSet="/_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-4460921%2Fv1%2F74dfdd09988f832e2c56c360.jpg%3FmaxDims%3D150x150&amp;w=128&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-4460921%2Fv1%2F74dfdd09988f832e2c56c360.jpg%3FmaxDims%3D150x150&amp;w=256&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-4460921%2Fv1%2F74dfdd09988f832e2c56c360.jpg%3FmaxDims%3D150x150&amp;w=256&amp;q=75"/><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black group-hover:tw-underline">Figure 7</p></button></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Introduction</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Time series anomaly detection (AD) plays an important role in a variety of fields by identifying outliers and unusual patterns that deviate from an expected behavior in sequential data. Its use in economics (Braei &amp; Wagner, <span citationid="CR4" class="CitationRef">2020</span>), information technology (IT) (Ji et al., <span citationid="CR13" class="CitationRef">2021</span>), healthcare (Schmidl et al., <span citationid="CR23" class="CitationRef">2022</span>) and geospatial fields (Barba et al., <span citationid="CR2" class="CitationRef">2021a</span>) could be used in the early detection of abnormal events, providing important information that could improve decision-making processes and the overall efficiency of many systems.</p> <p>Within the geospatial field, AD can be used as a tool in climate change analysis (Choi et al., <span citationid="CR6" class="CitationRef">2021</span>), natural disaster prediction (Miau &amp; Hung, <span citationid="CR21" class="CitationRef">2020</span>) and other areas, such as GNSS data monitoring (Barba et al., <span citationid="CR3" class="CitationRef">2021b</span>), with the latter being the focus of our work. AD in GNSS time series data could help to identify outliers and unusual patterns that could be related to abnormal events such as earthquakes and equipment changes/malfunctions (Ishikawa et al., <span citationid="CR12" class="CitationRef">2020</span>; Jing et al., <span citationid="CR14" class="CitationRef">2022</span>).</p> <p>To date, many algorithms have been developed to perform AD on time series data. These algorithms can be divided into three different groups: statistical methods (SMs), machine learning (ML) and deep learning (DL) (Lim &amp; Zohren, <span citationid="CR18" class="CitationRef">2021</span>). SMs include algorithms such as the Gaussian process (Williams &amp; Rasmussen, <span citationid="CR28" class="CitationRef">2006</span>) and Moving Average algorithms. In the ML area, the well-established Kalman filter (Verhaegen &amp; Verdult, <span citationid="CR25" class="CitationRef">2007</span>) is worth mentioning. Taking advantage of the nonlinearity provided by DL algorithms, one could mention long short-term memory (LSTM) networks (Lei et al., <span citationid="CR17" class="CitationRef">2024</span>), variational autoencoders (VAEs) (Desai et al., <span citationid="CR7" class="CitationRef">2021</span>) and transformer-based approaches (Ahmed et al., <span citationid="CR1" class="CitationRef">2022</span>).</p> <p>Vitti (<span citationid="CR26" class="CitationRef">2012</span>) used signal segmentation to detect anomalies in time series of GNSS coordinates, but the method could not handle missing data. Gazeaux et al. (<span citationid="CR8" class="CitationRef">2013</span>) reported that most automated and semiautomated methods available at that time could not detect anomalies with lower magnitudes than manual inspection. Wu et al. (<span citationid="CR29" class="CitationRef">2017</span>) designed software to perform anomaly detection in GNSS time series. The methods require hyperparameters that the user should interactively test. Several machine learning (Kiani, <span citationid="CR15" class="CitationRef">2020</span>) and time series decomposition (Ghaderpour, <span citationid="CR9" class="CitationRef">2021</span>; Lebrun et al., <span citationid="CR16" class="CitationRef">2021</span>) approaches have been developed for anomaly detection in time series of GNSS coordinates, but none have used state-of-the-art networks.</p> <p>Recently, considering the difficulty of mapping deeply intricate temporal dependencies in time series data, Wu et al. (<span citationid="CR30" class="CitationRef">2022</span>) presented a novel network architecture for performing anomaly detection in such data. TimesNet is a neural network that comprises the use of convolution neural networks and Fast Fourier Transform to map long-term temporal dependencies in time series data. Their architecture was tested against many benchmark datasets, achieving state-of-the-art (SOTA) performance.</p> <p>Therefore, considering the results obtained by TimesNet in such datasets, we propose its use to perform AD on weekly SIRGAS GNSS time series data provided by DGFI-TUM (Zhang et al., <span citationid="CR33" class="CitationRef">2024</span>). We hypothesize that TimesNet could map the complex temporal patterns present in this kind of data, specifically, data from stations in Brazil and Ecuador. The Brazilian stations were selected for analysis because they exhibit consistent behavior related to their location in the middle of the continental South American plate, which is characterized by a low level of tectonic deformation. In contrast, Ecuadorian stations were employed because they frequently present abnormalities due to earthquakes caused by subduction at the boundaries between the Nazca Plate (oceanic) and the South American Plate.</p> <p>To achieve our goal, we developed a Python code to download and preprocess weekly SIRGAS GNSS time series data from the selected stations. The preprocessed data were later used to train the TimesNet model with a set of different hyperparameters that were determined with the help of a hyperparameter optimization tool called the NNI (Yu &amp; Zhu, <span citationid="CR32" class="CitationRef">2020</span>). The best models were subsequently analyzed to identify which hyperparameters play a decisive role in the overall performance of the model. The optimized parameters were used to detect anomalies at 77 SIRGAS stations in Brazil and 18 in Ecuador, which were assessed against other filtering models to verify the model efficiency.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Materials and Methods</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>In this section, we describe the most relevant aspects of the TimesNet architecture, the data preparation process, the details of the neural network training process for individual GNSS stations and the performance assessment process developed in our work.</p> <p>TimesNet</p> <p>TimesNet operates by dividing the time series into non-overlapping windows, where each window represents a specific time period. The network is trained on these windows to learn the patterns within the data. During inference, the network generates predictions for each window. The difference between these predictions to the actual values in the windows are output as anomaly scores, where large discrepancies indicate potential anomalies.</p> <p>TimesNet is a deep neural network designed to model the temporal variation in 1D time series data. Real-world time series data usually present multiple periods, such as daily, weekly, and yearly, which interact with each other. Therefore, the network architecture captures temporal variations in a time series by decomposing 1D data in a 2D space that can explicitly map variations both within and between periods (Fig.&nbsp;<span refid="Fig1" class="InternalRef">1</span>).</p> <p>  </p> <p>This process depends on the discovery of periods present in the data. This is achieved by employing the Fast Fourier Transform (FFT). By analyzing the frequency domain of the FFT processed data, it is possible to verify that the first few peak frequencies are the most significant. Thus, to avoid noise originating from high frequencies, only the top-k frequencies are selected to determine which periods will be processed by TimesNet.</p> <p>This leads to the overall modular architecture of TimesNet (Fig.&nbsp;<span refid="Fig2" class="InternalRef">2</span>), which is composed of a stack of so-called TimesBlocks that are connected in a residual way. A TimesBlock receives data in 1D space and processes these data with FFT to discover the most significant periods. Each period is then transformed into a 2D space and processed by a shared inception block that makes use of 2D convolutions to capture intra/interperiod variations. Each 2D space data point is then transformed back into 1D space data through an adaptive aggregation according to their relative importance, which is determined by applying SoftMax to the output of the 2D convolutions (Fig.&nbsp;<span refid="Fig2" class="InternalRef">2</span>).</p> <p>  </p> <p>The inception block used in the timesblock follows the first version published by Szegedy et al. (<span citationid="CR24" class="CitationRef">2014</span>), which uses up to 2<sup>num_kernels + 1</sup> parallel convolution layers with different kernel sizes (e.g.: 1x1, 3x3, 5x5), is responsible for capturing temporal variations in a 2D space (interperiod-variation and intraperiod-variation) as shown in the left part of Fig.&nbsp;<span refid="Fig1" class="InternalRef">1</span>. It can be replaced by various computer vision backbones to process 2D transformed space data. Visual backbones such as ResNet (He et al., <span citationid="CR10" class="CitationRef">2016</span>), ResNeXT (Xie et al., <span citationid="CR31" class="CitationRef">2016</span>), ConvNeXT (Liu et al., <span citationid="CR20" class="CitationRef">2022</span>) and attention-based models (Liu et al., <span citationid="CR19" class="CitationRef">2021</span>) can be explored, which brings flexibility to the network and takes advantage of the developments achieved by the computer vision community (H. Wu et al., <span citationid="CR30" class="CitationRef">2022</span>).</p> <p>Since TimesNet was released as an open-source software, it was later adapted to some Python time series libraries. DeepOD is an open-source Python library that performs anomaly detection and outlier detection using deep learning methods, including TimesNet. The TimesNet implementation of DeepOD does not provide an early stop regularization technique. Therefore, considering the importance of such a technique, we developed an early stop function with patience and delta hyperparameters that were used in the training step of our experiments.</p> <p>TimesNet Hyperparameters</p> <p>The hyperparameters necessary to train TimesNet (Table&nbsp;<span refid="Tab1" class="InternalRef">1</span>) are those originally present in the DeepOD implementation plus the patience and delta that were included by our early stop implementation.</p> <p> <div class="gridtable"><table float="Yes" id="Tab1" border="1"> <caption language="En"> <div class="CaptionNumber">Table 1</div> <div class="CaptionContent"> <p>TimesNet hyperparameters and default values</p> </div> </caption> <colgroup cols="3"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="left" class="colspec" colname="c2" colnum="2"></div> <div align="left" class="colspec" colname="c3" colnum="3"></div> <thead> <tr> <th align="left" colname="c1"> <p>Name</p> </th> <th align="left" colname="c2"> <p>Definition</p> </th> <th align="left" colname="c3"> <p>Default Value</p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1"> <p>seq_len</p> </td> <td align="left" colname="c2"> <p>Length of the input sequences</p> </td> <td align="left" colname="c3"> <p>100</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>stride</p> </td> <td align="left" colname="c2"> <p>Stride for sliding window on data</p> </td> <td align="left" colname="c3"> <p>1</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>lr</p> </td> <td align="left" colname="c2"> <p>Learning rate for optimizer</p> </td> <td align="left" colname="c3"> <p>1e-4</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>epochs</p> </td> <td align="left" colname="c2"> <p>Number of epochs to train the model</p> </td> <td align="left" colname="c3"> <p>10</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>batch_size</p> </td> <td align="left" colname="c2"> <p>Size of batches for training</p> </td> <td align="left" colname="c3"> <p>32</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>epoch_steps</p> </td> <td align="left" colname="c2"> <p>Number of steps per epoch</p> </td> <td align="left" colname="c3"> <p>20</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>pred_len</p> </td> <td align="left" colname="c2"> <p>Prediction length for the model</p> </td> <td align="left" colname="c3"> <p>0</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>e_layers</p> </td> <td align="left" colname="c2"> <p>Number of TimeBlocks to stack</p> </td> <td align="left" colname="c3"> <p>2</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>d_model</p> </td> <td align="left" colname="c2"> <p>Dimensionality of the model (number of features generated by the data embedding)</p> </td> <td align="left" colname="c3"> <p>64</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>d_ff</p> </td> <td align="left" colname="c2"> <p>Dimensionality of the feedforward layers (TimesBlock internal convolution dimension)</p> </td> <td align="left" colname="c3"> <p>64</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>dropout</p> </td> <td align="left" colname="c2"> <p>Dropout rate in the data embedding</p> </td> <td align="left" colname="c3"> <p>0.1</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>top_k</p> </td> <td align="left" colname="c2"> <p>Top K frequencies for FFT period finding</p> </td> <td align="left" colname="c3"> <p>5</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>num_kernels</p> </td> <td align="left" colname="c2"> <p>Number of convolutional layers in the Inception Block</p> </td> <td align="left" colname="c3"> <p>6</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>patience</p> </td> <td align="left" colname="c2"> <p>Number of epochs under convergence to early stop</p> </td> <td align="left" colname="c3"> <p>3</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>delta</p> </td> <td align="left" colname="c2"> <p>Convergence value for the early stopping</p> </td> <td align="left" colname="c3"> <p>1e-7</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>percentile</p> </td> <td align="left" colname="c2"> <p>Is not a model hyperparameter, but is used to make predictions</p> </td> <td align="left" colname="c3"> <p>99%</p> </td> </tr> </tbody> </colgroup> </table></div> </p> <p>Data preparation</p> <p>SIRGAS records the GNSS observables of each continuously monitored station in the SIRGAS network. These observations are used to provide weekly solutions for the GNSS positions of each station monitored. A total of three files are made available for each station every week: NEU (north, east, and up coordinates), DSC (discontinuities) and XYZ (geocentric coordinates). The NEU local geodetic coordinates of a station represent the difference between the current week position and the first position in the time series (DN, DE, DU). The NEU file also provides the same information as the DSC file about the recorded events that could affect the time series, such as earthquakes and equipment changes/failures.</p> <p>The discontinuities provided by SIRGAS do not represent every possible data problem in the time series. For example, some series may be affected by missing data, leading to unreported gaps in the DSC files, and certain minor equipment changes may not affect the station's position. Therefore, our preprocessing includes the edges of data gaps such as anomalies (Fig.&nbsp;<span refid="Fig3" class="InternalRef">3</span>).</p> <p>  </p> <p>For each selected station, the files are downloaded and preprocessed. The data extracted from the NEU file are used to create two CSV files that are used to train and evaluate TimesNet and the other comparison models, being the inputs used for each anomaly detection method. The first CSV file, made for training, contains the GPS week, DN, DE and DU. The second CSV file, used to assess model performance, contains the GPS week and a discontinuity label. If a recorded week contains a discontinuity, it is labeled 1; otherwise, it is labeled 0. The gaps were filled with the value 0. To represent the time series direction (from earlier to later), the first point in the gap and the first point after the gap were marked as anomaly labels.</p> <p>Single-station hyperparameter optimization</p> <p>TimesNet uses some hyperparameters that can be changed to adapt the network to different time series, thus defining different models for each set of hyperparameters. To fit a set of hyperparameters to the SIRGAS time series, we performed hyperparameter optimization for two stations. Considering that each station could be subject to different tectonic influences and different conditions regarding changes/failures of equipment, we performed the training steps individually. The objective was to determine a set of hyperparameters that could be shared among others to deliver similar performance metrics.</p> <p>To determine the best hyperparameters, we used the Neural Network Intelligence (NNI) toolkit (Microsoft, <span citationid="CR22" class="CitationRef">2021</span>). We defined a search space for the TimesNet hyperparameters as described in Table&nbsp;<span refid="Tab2" class="InternalRef">2</span>.</p> <p> <div class="gridtable"><table float="Yes" id="Tab2" border="1"> <caption language="En"> <div class="CaptionNumber">Table 2</div> <div class="CaptionContent"> <p>Hyperparameter search space for TimesNet.</p> </div> </caption> <colgroup cols="3"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="left" class="colspec" colname="c2" colnum="2"></div> <div align="left" class="colspec" colname="c3" colnum="3"></div> <thead> <tr> <th align="left" colname="c1"> <p>HP</p> </th> <th align="left" colname="c2"> <p>Search Space</p> </th> <th align="left" colname="c3"> <p>Rational</p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1"> <p>seq_len</p> </td> <td align="left" colname="c2"> <p>Choice in [10, 20]</p> </td> <td align="left" colname="c3"> <p>Empirically determined: smaller values delivered better results for the GNSS SIRGAS stations</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>e_layers</p> </td> <td align="left" colname="c2"> <p>Choice in [2,3]</p> </td> <td align="left" colname="c3"> <p>Best results according to the original paper</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>d_model</p> </td> <td align="left" colname="c2"> <p>Choice in [32, 64, 128]</p> </td> <td align="left" colname="c3"> <p>Best results according to the original paper</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>d_ff</p> </td> <td align="left" colname="c2"> <p>Choice in [32, 64, 128]</p> </td> <td align="left" colname="c3"> <p>The original implementation usually uses d_ff&thinsp;=&thinsp;d_model</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>dropout</p> </td> <td align="left" colname="c2"> <p>Quniform in [0.1, 0.3, 0.1]</p> </td> <td align="left" colname="c3"> <p>Empirically determined: using the default value as starting point at steps of 5%</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>top_k</p> </td> <td align="left" colname="c2"> <p>Choice in [3, 5]</p> </td> <td align="left" colname="c3"> <p>Best result according to the original paper</p> </td> </tr> </tbody> </colgroup> </table></div> </p> <p>In the training step, we obtained anomaly scores for each point in the time series. Two sets of predictions were calculated based on the anomaly scores: the top 1% (percentile 1) and the top S (where S is the number of anomalies in the truth set). The top 1% prediction set marks the top 1% scores as predicted anomalies, while the top S prediction set marks the top S scores. The latter was created to avoid the effects of selecting a percentile threshold.</p> <p>During the test step, the truth set and each prediction set were used to calculate the accuracy, precision, recall, F1 and MSE metrics (Chicco &amp; Jurman, <span citationid="CR5" class="CitationRef">2020</span>) to assess the performance of the model. Thus, we compared the unsupervised labels obtained from the anomaly scores against the labels determined during the preprocessing step (i.e. maintainer anomalies plus data gaps borders). The accuracy, precision, recall and F1 are calculated with the number of true positives (TPs), true negatives (TNs), false positives (FPs) and false negatives (FNs), and the MSE is calculated based on predictions and observations, as summarized in Table&nbsp;<span refid="Tab3" class="InternalRef">3</span>. We chose the MSE metric for the HPO search because it uses the anomaly scores output by the TimesNet decision function, not relying on predictions that are generated based on a percentile value.</p> <p> <div class="gridtable"><table float="Yes" id="Tab3" border="1"> <caption language="En"> <div class="CaptionNumber">Table 3</div> <div class="CaptionContent"> <p>Metrics used and their definitions.</p> </div> </caption> <colgroup cols="4"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="left" class="colspec" colname="c2" colnum="2"></div> <div align="left" class="colspec" colname="c3" colnum="3"></div> <div align="left" class="colspec" colname="c4" colnum="4"></div> <thead> <tr> <th align="left" colname="c1"> <p>Metric</p> </th> <th align="left" colname="c2"> <p>Description</p> </th> <th align="left" colname="c3"> <p>Formula</p> </th> <th align="left" colname="c4"> <p>Remarks</p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1"> <p>Accuracy</p> </td> <td align="left" colname="c2"> <p>Determine the proportion of correct predictions over all samples</p> </td> <td align="left" colname="c3"> <p><span class="InlineEquation"><span class="mathinline">\(\:acc=\frac{TP+TN}{TP+TN+FP+FN}\)</span></span></p> </td> <td align="left" colname="c4"> <p>Doesn&rsquo;t deal with class imbalance</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Precision</p> </td> <td align="left" colname="c2"> <p>Determine the proportion of predictions that are correct</p> </td> <td align="left" colname="c3"> <p><span class="InlineEquation"><span class="mathinline">\(\:p=\frac{TP}{TP+FP}\)</span></span></p> </td> <td align="left" colname="c4"> <p>Disregards the number of FN that the model fails to identify</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Recall</p> </td> <td align="left" colname="c2"> <p>Determine the proportion of actual positives that were correctly predicted</p> </td> <td align="left" colname="c3"> <p><span class="InlineEquation"><span class="mathinline">\(\:r=\frac{TP}{TP+FN}\)</span></span></p> </td> <td align="left" colname="c4"> <p>Disregards the number of FP that were incorrectly classified by the model</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>F1</p> </td> <td align="left" colname="c2"> <p>Harmonic mean between Precision (p) and Recall (r)</p> </td> <td align="left" colname="c3"> <p><span class="InlineEquation"><span class="mathinline">\(\:f1=\frac{2\left(pr\right)}{p+r}\)</span></span></p> </td> <td align="left" colname="c4"> <p>Addresses limitations of precision and recall, providing a balanced assessment for imbalanced dataset</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>MSE</p> </td> <td align="left" colname="c2"> <p>The mean-square error between observed and&nbsp;predicted values</p> </td> <td align="left" colname="c3"> <p><span class="InlineEquation"><span class="mathinline">\(\:mse=\:\frac{1}{n}\sum\:_{i=1}^{n}{({o}_{i}-{p}_{i})}^{2}\)</span></span></p> </td> <td align="left" colname="c4"> <p>Larger errors are punished more heavily than smaller errors.</p> </td> </tr> </tbody> </colgroup> </table></div> </p> <p>As the F1<sub>topS</sub> is calculated using the top S predicted labels, for each FP labeled there is a FN label, which makes FP equal to FN. This ultimately makes Precision<sub>topS</sub>, Recall<sub>topS</sub> and F1<sub>topS</sub> equal. Therefore, we only present F1<sub>topS</sub> in the metrics table.</p> <p>Multiple-station assessment</p> <p>To assess the overall performance of TimesNet in detecting anomalies across all the selected stations (77 from Brazil and 18 from Ecuador), we developed a procedure to evaluate its general effectiveness.</p> <p>The single-station training procedure was used to obtain optimized hyperparameters for two selected stations that presented visually distinct behaviors, notably, stations such as BRAZ and CHEC. Stations such as the BRAZ exhibit more consistent behavior, with smaller discontinuities normally originating from equipment changes or jumps in some of the positional components (i.e., jumps in N or E). Stations such as the CHEC present large discontinuities due to earthquakes, such as the 2016 Pedernales/Ecuador earthquake (Mw7.8) and the 2019 Palora/Ecuador earthquake (Mw7.5) registered at this station.</p> <p>We evaluated the differences between the hyperparameters obtained with BRAZ and those obtained with CHEC. Therefore, the optimized hyperparameters obtained for each station were used in a global training process, which essentially included a single-station training procedure to obtain the predictions for each station used in our research. The predictions and labels of each station are then stacked to calculate the global metrics. TimesNet and the other comparison models produce an anomaly score for each point in the input series as outputs from each model. Higher scores indicate a greater chance that the point is an anomaly. Building on the previously described performance metrics (Table&nbsp;<span refid="Tab3" class="InternalRef">3</span>), during the prediction step, anomaly scores in the top 1% percentile are labeled anomalies, while anomaly scores under the percentile parameter are labeled normal.</p> <p>Comparisons with other models</p> <p>We performed multiple-station assessments with other well-known models to compare the results obtained with those of TimesNet. We used the DARTS library (Herzen et al., <span citationid="CR11" class="CitationRef">2022</span>) and selected the following available anomaly detection filters: Kalman (Verhaegen &amp; Verdult, <span citationid="CR25" class="CitationRef">2007</span>), Gaussian process (Williams &amp; Rasmussen, <span citationid="CR28" class="CitationRef">2006</span>) and Moving Average. Additionally, we selected a LSTM neural network forecaster from DARTS library, using the hyperparameters that achieved the best results for GNSS coordinates time series forecast as stated by Wang et al. (<span citationid="CR27" class="CitationRef">2021</span>). These models were paired with three anomaly scorer methods (e.g., Norm, K-means and Difference). Each filter was tested with each scorer method on every station in both datasets.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Results and discussion</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Single-station hyperparameter optimization results</p> <p>Our experiments started with a single-station training process with two stations, one from Brazil (BRAZ) and the other from Ecuador (CHEC). For each station, NNI was set to perform up to 50 experiments with different hyperparameter combinations drawn from the search space shown in Table&nbsp;<span refid="Tab2" class="InternalRef">2</span>. The hyperparameters with optimal performance after optimization were used to define two TimesNet models that were used in our experiments. The results are presented in Table&nbsp;<span refid="Tab4" class="InternalRef">4</span>.</p> <p> <div class="gridtable"><table float="Yes" id="Tab4" border="1"> <caption language="En"> <div class="CaptionNumber">Table 4</div> <div class="CaptionContent"> <p>Hyperparameter optimization results.</p> </div> </caption> <colgroup cols="3"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="left" class="colspec" colname="c2" colnum="2"></div> <div align="left" class="colspec" colname="c3" colnum="3"></div> <thead> <tr> <th align="left" colname="c1"> <p>Hyperparameters</p> </th> <th align="left" colname="c2"> <p>BRAZ</p> </th> <th align="left" colname="c3"> <p>CHEC</p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1"> <p>seq_len</p> </td> <td align="left" colname="c2"> <p>10</p> </td> <td align="left" colname="c3"> <p>10</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>e_layers</p> </td> <td align="left" colname="c2"> <p>2</p> </td> <td align="left" colname="c3"> <p>3</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>d_model</p> </td> <td align="left" colname="c2"> <p>128</p> </td> <td align="left" colname="c3"> <p>64</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>d_ff</p> </td> <td align="left" colname="c2"> <p>32</p> </td> <td align="left" colname="c3"> <p>128</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>dropout</p> </td> <td align="left" colname="c2"> <p>0.3</p> </td> <td align="left" colname="c3"> <p>0.4</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>top_k</p> </td> <td align="left" colname="c2"> <p>4</p> </td> <td align="left" colname="c3"> <p>5</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>MSE</p> </td> <td align="left" colname="c2"> <p>0.0064</p> </td> <td align="left" colname="c3"> <p>0.0140</p> </td> </tr> </tbody> </colgroup> </table></div> </p> <p>The combination of the top hyperparameters (e.g., the hyperparameter set that achieved the best performance over all 50 experiments) generated by the HPO for BRAZ generated a TimesNet model with two TimesBlocks that was able to reach a MSE of 0.0064.</p> <p>Conversely, the top hyperparameter combination generated by the HPO made with CHEC generated a TimesNet model with three TimesBlocks that was able to reach a MSE of 0.0140. It is worth highlighting that for CHEC, the model demanded a d_ff hyperparameter four times larger than BRAZ to achieve its best result.</p> <p>Multiple-station assessment results</p> <p>To assess the effect of using either hyperparameter set found in the single-station experiment to perform anomaly detection in GNSS time series data, we executed multiple-station assessments at all selected stations in Brazil and Ecuador separately, exchanging the optimized hyperparameters obtained for BRAZ and CHEC. Table&nbsp;<span refid="Tab5" class="InternalRef">5</span> contains the metrics obtained with both hyperparameter sets (trained on CHEC and BRAZ) using both datasets (Brazil and Ecuador).</p> <p>Leveraging the best hyperparameters, we trained two TimesNet models to generate anomaly predictions for each station. TimesNet produces an anomaly score for each point in the input series. Higher scores indicate a greater chance that the point is an anomaly. During the prediction step, anomaly scores in the top 1% percentile are labeled anomalies, while anomaly scores under the percentile parameter are labeled normal.</p> <p> <div class="gridtable"><table float="Yes" id="Tab5" border="1"> <caption language="En"> <div class="CaptionNumber">Table 5</div> <div class="CaptionContent"> <p>Global metrics calculated with exchanged hyperparameters with full processing time (training&thinsp;+&thinsp;inference).</p> </div> </caption> <colgroup cols="5"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="char" char="." class="colspec" colname="c2" colnum="2"></div> <div align="char" char="." class="colspec" colname="c3" colnum="3"></div> <div align="char" char="." class="colspec" colname="c4" colnum="4"></div> <div align="char" char="." class="colspec" colname="c5" colnum="5"></div> <thead> <tr> <th align="left" colname="c1" morerows="1" rowspan="2"> <p>HPO station</p> </th> <th align="left" colspan="2" nameend="c3" namest="c2"> <p>Brazil</p> </th> <th align="left" colspan="2" nameend="c5" namest="c4"> <p>Ecuador</p> </th> </tr> <tr> <th align="left" colname="c2"> <p>BRAZ</p> </th> <th align="left" colname="c3"> <p>CHEC</p> </th> <th align="left" colname="c4"> <p>BRAZ</p> </th> <th align="left" colname="c5"> <p>CHEC</p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1"> <p>Accuracy (%)</p> </td> <td align="char" char="." colname="c2"> <p>98.71</p> </td> <td align="char" char="." colname="c3"> <p><b>98.81</b></p> </td> <td align="char" char="." colname="c4"> <p><b>98.08</b></p> </td> <td align="char" char="." colname="c5"> <p>97.99</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Precision (%)</p> </td> <td align="char" char="." colname="c2"> <p>55.96</p> </td> <td align="char" char="." colname="c3"> <p><b>60.63</b></p> </td> <td align="char" char="." colname="c4"> <p><b>73.47</b></p> </td> <td align="char" char="." colname="c5"> <p>69.39</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Recall (%)</p> </td> <td align="char" char="." colname="c2"> <p>42.06</p> </td> <td align="char" char="." colname="c3"> <p><b>45.58</b></p> </td> <td align="char" char="." colname="c4"> <p><b>32.73</b></p> </td> <td align="char" char="." colname="c5"> <p>30.91</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>F1<sub>1%</sub> (%)</p> </td> <td align="char" char="." colname="c2"> <p>48.03</p> </td> <td align="char" char="." colname="c3"> <p><b>52.04</b></p> </td> <td align="char" char="." colname="c4"> <p><b>45.28</b></p> </td> <td align="char" char="." colname="c5"> <p>42.77</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>F1<sub>topS</sub> (%)</p> </td> <td align="char" char="." colname="c2"> <p>51.47</p> </td> <td align="char" char="." colname="c3"> <p><b>55.67</b></p> </td> <td align="char" char="." colname="c4"> <p>62.73</p> </td> <td align="char" char="." colname="c5"> <p><b>63.64</b></p> </td> </tr> <tr> <td align="left" colname="c1"> <p>MSE</p> </td> <td align="char" char="." colname="c2"> <p>0.0099</p> </td> <td align="char" char="." colname="c3"> <p><b>0.0095</b></p> </td> <td align="char" char="." colname="c4"> <p><b>0.0145</b></p> </td> <td align="char" char="." colname="c5"> <p><b>0.0145</b></p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Time (s)</p> </td> <td align="char" char="." colname="c2"> <p><b>822.55</b></p> </td> <td align="char" char="." colname="c3"> <p>1467.57</p> </td> <td align="char" char="." colname="c4"> <p><b>90.97</b></p> </td> <td align="char" char="." colname="c5"> <p>197.04</p> </td> </tr> </tbody> </colgroup> </table></div> </p> <p>The differences between the results obtained with both hyperparameter sets were not greater than 5%. The precision, recall and F1<sub>1%</sub> metrics were greater in Brazil than in Ecuador, with a greater percentage of anomalies detected with anomaly scores in the top 1% quantile. The F1<sub>topS</sub> metric provides a percentage of how many discontinuities each model found compared to the number of discontinuities in the labeled data. In the Brazil dataset, more than 55% of the discontinuities were found by the networks, while more than 63% were found in the Ecuador dataset. This means that TimesNet was able to detect most of the anomalies at the Ecuadorian stations but misclassified higher anomaly scores (recall 45.58% in Brazil and 32.73% in Ecuador). This is probably because effects of an earthquake in the weekly time series might not occur on the first week after the event, so the method produced labels on the part of the time series where the coordinates began to change. This could be improved with better models for the earthquake effects for labeled data.</p> <p>Comparisons with other models</p> <p>Multiple-station results with DARTS methods are presented along with TimesNet results to aid comparisons. Table&nbsp;<span refid="Tab6" class="InternalRef">6</span> presents the results of multiple-station processing for the 77 stations in Brazil. It is possible to observe that TimesNet obtained the second place in all the metrics, remaining only behind Kalman with the Norm scorer.</p> <p> <div class="gridtable"><table float="Yes" id="Tab6" border="1"> <caption language="En"> <div class="CaptionNumber">Table 6</div> <div class="CaptionContent"> <p>Brazilian station results: Metric values for Gaussian, Kalman, Moving Average and LSTM with Norm, K-means and Difference scores side by side with TimesNet with full processing time (training&thinsp;+&thinsp;inference).</p> </div> </caption> <colgroup cols="8"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="char" char="." class="colspec" colname="c2" colnum="2"></div> <div align="char" char="." class="colspec" colname="c3" colnum="3"></div> <div align="char" char="." class="colspec" colname="c4" colnum="4"></div> <div align="char" char="." class="colspec" colname="c5" c hind Kalman with Norm scorer. The LSTM forecaster with the Norm scorer, which achieved the third best results, obtained significantly lower precision, recall and F1<sub>1%</sub> than did TimesNet with CHEC parameters.</p> <p> <div class="gridtable"><table float="Yes" id="Tab7" border="1"> <caption language="En"> <div class="CaptionNumber">Table 7</div> <div class="CaptionContent"> <p>Ecuador station results: Metric values for the Gaussian, Kalman, Moving Average and LSTM models with Norm, K-means and Difference scores side by side with TimesNet with full processing time (training&thinsp;+&thinsp;inference).</p> </div> </caption> <colgroup cols="8"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="char" char="." class="colspec" colname="c2" colnum="2"></div> <div align="char" char="." class="colspec" colname="c3" colnum="3"></div> <div align="char" char="." class="colspec" colname="c4" colnum="4"></div> <div align="char" char="." class="colspec" colname="c5" colnum="5"></div> <div align="char" char="." class="colspec" colname="c6" colnum="6"></div> <div align="char" char="." class="colspec" colname="c7" colnum="7"></div> <div align="char" char="." class="colspec" colname="c8" colnum="8"></div> <thead> <tr> <th align="left" colname="c1"> <p>Experiment</p> </th> <th align="left" colname="c2"> <p>Accuracy</p> </th> <th align="left" colname="c3"> <p>Precision</p> </th> <th align="left" colname="c4"> <p>Recall</p> </th> <th align="left" colname="c5"> <p>F1<sub>1%</sub></p> </th> <th align="left" colname="c6"> <p>F1<sub>topS</sub></p> </th> <th align="left" colname="c7"> <p>MSE</p> </th> <th align="left" colname="c8"> <p>Time (s):</p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1"> <p>Gaussian process Norm</p> </td> <td align="char" char="." colname="c2"> <p>97.37%</p> </td> <td align="char" char="." colname="c3"> <p>40.82%</p> </td> <td align="char" char="." colname="c4"> <p>18.18%</p> </td> <td align="char" char="." colname="c name="c5"> <p><b>45.28%</b></p> </td> <td align="char" char="." colname="c6"> <p>62.73%</p> </td> <td align="char" char="." colname="c7"> <p><b>0.0145</b></p> </td> <td align="char" char="." colname="c8"> <p><b>90.97</b></p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Timesnet CHEC parameters</p> </td> <td align="char" char="." colname="c2"> <p>97.99%</p> </td> <td align="char" char="." colname="c3"> <p>69.39%</p> </td> <td align="char" char="." colname="c4"> <p>30.91%</p> </td> <td align="char" char="." colname="c5"> <p>42.77%</p> </td> <td align="char" char="." colname="c6"> <p><b>63.64%</b></p> </td> <td align="char" char="." colname="c7"> <p><b>0.0145</b></p> </td> <td align="char" char="." colname="c8"> <p>197.04</p> </td> </tr> </tbody> </colgroup> </table></div> </p> <p>In both Ecuador and Brazil datasets, we found that the Norm scorer obtained the best results with every filter (Gaussian, Kalman, Moving Average) and LSTM, while the K-means scorer obtained the worst results in every experiment. The improvement from Difference scorer to Norm scorer ranged from 64&ndash;242%. Future work could focus only on the Norm scorer because the other scorers cannot achieve similar results in these time series.</p> <p>Using the best results from TimesNet and DARTS, we calculated the differences in the computed metrics for both sets of stations. Table&nbsp;<span refid="Tab8" class="InternalRef">8</span> shows, side by side, the best results from TimesNet and DARTS, where it is possible to observe the metric differences.</p> <p> <div class="gridtable"><table float="Yes" id="Tab8" border="1"> <caption language="En"> <div class="CaptionNumber">Table 8</div> <div class="CaptionContent"> <p>Comparison between the Kalman model with the Norm scorer and TimesNet with full processing time (training&thinsp;+&thinsp;inference).</p> </div> </caption> <colgroup cols="7"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="char" char="." class="colspec" colname="c2" colnum="2"></div> <div align="char" char="." class="colspec" colname="c3" colnum="3"></div> <div align="char" char="." class="colspec" colname="c4" colnum="4"></div> <div align="char" char="." class="colspec" colname="c5" colnum="5"></div> <div align="char" char="." class="colspec" colname="c6" colnum="6"></div> <div align="char" char="." class="colspec" colname="c7" colnum="7"></div> <thead> <tr> <th align="left" colname="c1" morerows="1" rowspan="2"> <p>Metric</p> </th> <th align="left" colspan="2" nameend="c3" namest="c2"> <p>Ecuador</p> </th> <th align="left" colname="c4" morerows="1" rowspan="2"> <p>Difference</p> <p>(Kalman-TimesNet)</p> </th> <th align="left" colspan="2" nameend="c6" namest="c5"> <p>Brazil</p> </th> <th align="left" colname="c7" morerows="1" rowspan="2"> <p>Difference</p> <p>(Kalman-TimesNet)</p> </th> </tr> <tr> <th align="left" colname="c2"> <p>Kalman/Norm</p> </th> <th align="left" colname="c3"> <p>TimesNet (BRAZ)</p> </th> <th align="left" colname="c5"> <p>Kalman/Norm</p> </th> <th align="left" colname="c6"> <p>TimesNet (CHEC)</p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1"> <p>Accuracy (%)</p> </td> <td align="char" char="." colname="c2"> <p><b>98.17</b></p> </td> <td align="char" char="." colname="c3"> <p>98.08</p> </td> <td align="char" char="." colname="c4"> <p>0.09</p> </td> <td align="char" char="." colname="c5"> <p><b>98.84</b></p> </td> <td align="char" char="." colname="c6"> <p>98.81</p> </td> <td align="char" char="." colname="c7"> <p>0.03</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Precision (%)</p> </td> <td align="char" char="." colname="c2"> <p><b>77.55</b></p> </td> <td align="char" char="." colname="c3"> <p>73.47</p> </td> <td align="char" char="." colname="c4"> <p>4.08</p> </td> <td align="char" char="." colname="c5"> <p><b>62.14</b></p> </td> <td align="char" char="." colname="c6"> <p>60.63</p> </td> <td align="char" char="." colname="c7"> <p>1.51</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Recall (%)</p> </td> <td align="char" char="." colname="c2"> <p><b>34.55</b></p> </td> <td align="char" char="." colname="c3"> <p>32.73</p> </td> <td align="char" char="." colname="c4"> <p>1.82</p> </td> <td align="char" char="." colname="c5"> <p><b>46.71</b></p> </td> <td align="char" char="." colname="c6"> <p>45.58</p> </td> <td align="char" char="." colname="c7"> <p>1.13</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>F1 <sub>1%</sub> (%)</p> </td> <td align="char" char="." colname="c2"> <p><b>47.80</b></p> </td> <td align="char" char="." colname="c3"> <p>45.28</p> </td> <td align="char" char="." colname="c4"> <p>2.52</p> </td> <td align="char" char="." colname="c5"> <p><b>53.33</b></p> </td> <td align="char" char="." colname="c6"> <p>52.04</p> </td> <td align="char" char="." colname="c7"> <p>1.29</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>F1 <sub>topS</sub> (%)</p> </td> <td align="char" char="." colname="c2"> <p>59.09</p> </td> <td align="char" char="." colname="c3"> <p><b>62.73</b></p> </td> <td align="char" char="." colname="c4"> <p>-3.64</p> </td> <td align="char" char="." colname="c5"> <p><b>57.60</b></p> </td> <td align="char" char="." colname="c6"> <p>55.67</p> </td> <td align="char" char="." colname="c7"> <p>1.93</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>MSE</p> </td> <td align="char" char="." colname="c2"> <p>0.0344</p> </td> <td align="char" char="." colname="c3"> <p><b>0.0145</b></p> </td> <td align="char" char="." colname="c4"> <p>0.02</p> </td> <td align="char" char="." colname="c5"> <p><b>0.0094</b></p> </td> <td align="char" char="." colname="c6"> <p>0.0095</p> </td> <td align="char" char="." colname="c7"> <p>-0.0001</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Time (s)</p> </td> <td align="char" char="." colname="c2"> <p><b>6.70</b></p> </td> <td align="char" char="." colname="c3"> <p>90.97</p> </td> <td align="char" char="." colname="c4"> <p>-84.27</p> </td> <td align="char" char="." colname="c5"> <p><b>35.39</b></p> </td> <td align="char" char="." colname="c6"> <p>1467.57</p> </td> <td align="char" char="." colname="c7"> <p>-1432.18</p> </td> </tr> </tbody> </colgroup> </table></div> </p> <p>For Ecuador, it is possible to observe that the absolute difference stays under 5% for all percentage metrics. For Brazil, it is possible to observe that the absolute difference stays under 2% for all percentage metrics. Similarly, the absolute MSE difference is 0.0001 for Brazil and 0.02 for Ecuador. The difference in MSE shows that the anomaly scores produced by TimesNet are more accurate, with peaks in the labels and values near zero in points that are not predicted as anomalies.</p> <p>It is possible to observe that the differences are lower for the Brazilian stations, which tend to present more consistent behavior. Conversely, for the stations in Ecuador that tend to experience larger discontinuities due to earthquakes, the differences are greater.</p> <p>Additionally, considering that Brazil has 77 stations and Ecuador has 18 stations, it is possible that the differences between TimesNet and the Kalman/Norm implementation for DARTS could decrease as the number of stations used in the multiple-station assessment increases.</p> <p>Visual assessment of the results</p> <p>The outputs of the training process at BRAZ and CHEC stations were plotted to aid in the visual assessment of model performance. The predictions and scores output by TimesNet are overlaid on the time series data and the registered discontinuities to provide a combined view of the input data and the predicted results. The plots depict registered discontinuities as vertical black dotted lines for reference, and the predicted anomaly labels are represented by red vertical lines. Figure&nbsp;<span refid="Fig4" class="InternalRef">4</span> shows the plot for the BRAZ station.</p> <p>  </p> <p>For BRAZ, TimesNet was able to accurately detect most of the anomalous regions present in the time series. It is possible to see score spikes in the regions that are related to antenna and receiver changes registered in this station&rsquo;s NEU file. On the other hand, the network did not present score peaks for the first three anomalies, which can indicate that those anomalies did not generate sufficiently strong deviations from the expected pattern for this time series.</p> <p>For the CHEC station, the resulting plot (Fig.&nbsp;<span refid="Fig7" class="InternalRef">7</span>) shows that TimesNet correctly presented score spikes in the regions related to the 2016 Pedernales/Ecuador earthquake (Mw7.8) and the 2019 Palora/Ecuador earthquake (Mw7.5) in the regions related to antenna change and in the data gaps. Most of the spikes were not selected as anomalies due to the 99% percentile value.</p> <p>  </p> <p>To better assess the performance of TimesNet, we performed AD on the same stations using Kalman/Norm scorer because it outperformed TimesNet. The results can be found in Fig.&nbsp;<span refid="Fig6" class="InternalRef">6</span> and Fig.&nbsp;<span refid="Fig7" class="InternalRef">7</span>.</p> <p>  </p> <p>The anomaly scores provided by the Kalman filter with Norm scorer increase after the anomaly score peaks. This could be an issue because only the peaks are anomalies, and the points near them might be labeled anomalies depending on the quantile percentage chosen. Additionally, Kalman presented score spikes in two out of the first four anomalies (i.e., the 2nd and 3rd anomalies referring to antenna changes) that were not selected as anomalies due to the threshold value.</p> <p>  </p> <p>Unlike the anomaly scores obtained at the BRAZ station, the Kalman filter with the Norm scorer shows different patterns at the CHEC station. The anomaly scores increase until the data gap occurs near week 1900. Many points that are not anomalous received have anomaly scores above average before week 1900, reaching values higher than those of the previously labeled anomalies. This is undesirable because a higher threshold would incorrectly label points as anomalies. TimesNet presented a narrower distribution near the peaks, which suggests that it would be more accurate with higher percentile thresholds. The first four labels in CHEC illustrate why TimesNet obtained a higher F1<sub>topS</sub> (63.64%) than did Kalman/Norm (59.09%) at Ecuador stations, even though TimesNet achieved a worse F1<sub>1%</sub> score (45.28% and 47.80%, respectively).</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Conclusion</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>In this paper, we presented a complete process to download and preprocess real SIRGAS GNSS time series data that were later used as datasets in our anomaly detection implementation. We presented the concepts and overall architecture of TimesNet and compared the results obtained from it against three filtering models (Gaussian, Kalman and Moving Average) and a LSTM forecaster. We concluded that even though TimesNet obtained similar or better anomaly scores (measured by the MSE and F1<sub>topS</sub>) on real data, the classification results with the 1% percentile threshold were lower than Kalman/Norm scorer implementation provided by DARTS, achieving second place among the tested models.</p> <p>A hyperparameter optimization tool was used to tune TimesNet to achieve nearly optimal performance at two stations, according to our experiments. These optimized hyperparameters were used to train TimesNet against all selected stations (77 from Brazil and 18 from Ecuador). The combined results were assessed against the DARTS filtering models, which showed that TimesNet was outperformed by Kalman filter with the Norm scorer implementation provided by DARTS by a considerably small margin.</p> <p>Both models achieved good results on real data. Additionally, it was possible to visually assess that the anomaly scores output from TimesNet presented peaks at registered anomalies that were not selected as predictions due to the threshold value used (99%). TimesNet obtained the best F1<sub>Top S</sub> score in the Ecuador dataset, so it obtained the best results in series with more anomalous patterns. The lower MSE and visual inspection of the anomaly scores in the graphs suggests that TimesNet scores tend to fluctuate less than Kalman scores, which can make it less affected by the threshold value.</p> <p>Both models presented peaks at the data gaps, showing that the decision to create anomalies in such gaps was correct according to our experimental analysis. This measure was able to improve model performance for all tested solutions. Future work could improve the procedure that assigns labels for earthquakes, providing a better model for when the coordinates begin to change.</p> <p>In terms of processing time, TimesNet required considerably more processing time (i.e., hundreds of seconds) than did Kalman, which was able to process stations from both Brazil and Ecuador in a few minutes. We suggest starting future work by comparing the Kalman filter as the base model, as it is fast and achieves the best metrics in our datasets. It would be beneficial to include globally distributed stations in future research, considering our focus on stations in Brazil and Ecuador. Additionally, we recommend using the procedure presented here with various time series, including those generated daily.</p> <p>Considering that our work was performed only at stations in Brazil and Ecuador, we propose, as future work, the use of stations from other countries. We also propose the use of the procedure presented here with different time series, such as those provided by the NGL.</p> <p>Finally, we conclude that our preprocessing algorithm can be used to create real-world benchmark datasets for anomaly detection in GNSS data. Additionally, to foster future research, we offer a GitHub page with our scripts that can be promptly used at any SIRGAS station, demanding the creation of a text file containing the names of the stations to be processed.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Author Biographies</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><div class="Biography"> <p>  <p> <b>Luiz Claudio Oliveira de Andrade</b> received his B.Sc. degree in Cartographic Engineering in 2005 at the Military Institute of Engineering (IME). Postgraduate Diploma in Systems Engineering in 2011 at the Brazilian Open Superior School (ESAB). Postgraduate Diploma in Geoinformatics in 2014 at the Faculty of Geo-Information Science and Earth Observation of the University of Twente (ITC). M.Sc. in Applied Geosciences in 2018 at the University of Bras&iacute;lia (UnB). In 2022. he was assigned as Professor/Military Advisor by the Brazilian Army to the University of the Armed Forces (ESPE) in Ecuador. where he is lecturing Geospatial Databases and researching topics related to Deep Learning.</p> </p> </div> <div class="Biography"> <p> <b>Maur&iacute;cio Carvalho Mathias de Paulo</b> received his B.Sc. degree in Cartographic Engineering in 2007 at the Military Institute of Engineering (IME). M.Sc. in Remote Sensing in 2013 at the National Institute for Space Research (INPE) and Ph.D. in Defense Engineering at the IME in 2024. His current research is in Deep Learning for predicting ionospheric effects on GNSS signals.</p> </p> </div> <p> <b>Haroldo Antonio Marques</b> received his B.Sc. degree in Cartographic Engineering in 2005. M.Sc. in Cartographic Science in 2008 and Ph.D. in Cartopraphic Science in 2012 at S&atilde;o Paulo State University (UNESP). Presidente Prudente in Brazil. Since 2016. he is a Professor at the Cartographic Engineering Section of the Military Institute of Engineering (IME) at Rio de Janeiro in Brazil. where he is lecturing and researching topics related to Geodesy and Adjustment. especially those related to GNSS. Surveying. and Atmospheric Sciences.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Declarations</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p> <h2>Ethics approval and consent to participate</h2> <p>Not applicable.</p> </p><h2>Funding</h2> <p>L.C.O. de Andrade is currently assigned as Professor/Military Advisor by the Brazilian Army to the University of the Armed Forces of Ecuador (ESPE). M.C.M de Paulo is funded by Military Institute of Engineering (IME) of the Brazilian Army, at CMLabIME Project - Creation and Modernization of Laboratories at the Military Engineering Institute (FINEP Agreement No. 0122031900 - Ref. 0160/22). H.A. Marques (grant 431559/2018-0) is funded by CNPq.The authors have no competing interests to declare that are relevant to the content of this article.</p><h2>Author Contribution</h2><p>All authors contributed to the study conception and design. Material preparation, data collection and analysis were performed by L.C.O. de Andrade and M.C.M. de Paulo. The first draft of the manuscript was written by L.C.O. de Andrade and all authors commented on previous versions of the manuscript. All authors read and approved the final manuscript.</p><h2>Acknowledgement</h2><p>The authors thank DGFI-TUM for the publicly available GNSS time series files (e.g., NEU, dsc and XYZ). The authors would like to thank the Brazilian Army and Brazilian National Council for Scientific and Technological Development (CNPq).L.C.O. de Andrade is currently assigned as Professor/Military Advisor by the Brazilian Army to the University of the Armed Forces of Ecuador (ESPE). M.C.M de Paulo is funded by Military Institute of Engineering (IME) of the Brazilian Army, at CMLabIME Project - Creation and Modernization of Laboratories at the Military Engineering Institute (FINEP Agreement No. 0122031900 - Ref. 0160/22). H.A. Marques (grant 431559/2018-0) is funded by CNPq.</p><h2>Data Availability</h2><p>Code and data were released in the GitHub address https://github.com/mauriciodev/deep_anomaly_gnss to provide repeatability and reproducibility, while also providing new tools for the geodesy researchers.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">References</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-r
