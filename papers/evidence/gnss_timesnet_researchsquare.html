tinuities (vertical red lines) and anomaly scores.\u003c/p\u003e","description":"","filename":"Figure04.jpg","url":"https://assets-eu.researchsquare.com/files/rs-4460921/v1/5ddff9fd3fdf3ee50dc12cee.jpg"},{"id":69107048,"identity":"f5541082-8717-42af-8954-37eb80d028dc","added_by":"auto","created_at":"2024-11-15 17:25:46","extension":"jpg","order_by":5,"title":"Figure 5","display":"","copyAsset":false,"role":"figure","size":365602,"visible":true,"origin":"","legend":"\u003cp\u003eCHEC station time series (DN, DE, and DU) and the registered discontinuities (vertical black dotted lines) overlayed with the predicted discontinuities (vertical red lines) and anomaly scores.\u003c/p\u003e","description":"","filename":"Figure05.jpg","url":"https://assets-eu.researchsquare.com/files/rs-4460921/v1/7d8d55b79e278c4c99b4fca7.jpg"},{"id":69107046,"identity":"0b6c23cd-630f-48c6-a0b8-a345b2646033","added_by":"auto","created_at":"2024-11-15 17:25:45","extension":"jpg","order_by":6,"title":"Figure 6","display":"","copyAsset":false,"role":"figure","size":292270,"visible":true,"origin":"","legend":"\u003cp\u003eKalman/Norm scorer results on the BRAZ dataset.\u003c/p\u003e","description":"","filename":"Figure06.jpg","url":"https://assets-eu.researchsquare.com/files/rs-4460921/v1/09cfbe1dc21336396d1a240f.jpg"},{"id":69107043,"identity":"758cd37d-36f6-4eac-b209-424e44198559","added_by":"auto","created_at":"2024-11-15 17:25:45","extension":"jpg","order_by":7,"title":"Figure 7","display":"","copyAsset":false,"role":"figure","size":328549,"visible":true,"origin":"","legend":"\u003cp\u003eKalman/Norm scorer results on the CHEC dataset.\u003c/p\u003e","description":"","filename":"Figure07.jpg","url":"https://assets-eu.researchsquare.com/files/rs-4460921/v1/74dfdd09988f832e2c56c360.jpg"},{"id":78689087,"identity":"91875fbb-ae41-45c7-a2a8-ae53b8099ae5","added_by":"auto","created_at":"2025-03-17 16:11:08","extension":"pdf","order_by":0,"title":"","display":"","copyAsset":false,"role":"manuscript-pdf","size":3431540,"visible":true,"origin":"","legend":"","description":"","filename":"manuscript.pdf","url":"https://assets-eu.researchsquare.com/files/rs-4460921/v1/cc357d80-21b8-4f8f-85ae-308b9cf63585.pdf"}],"financialInterests":"No competing interests reported.","formattedTitle":"Anomaly Detection in weekly SIRGAS GNSS Time Series: A TimesNet assessment in real data","fulltext":[{"header":"Introduction","content":"\u003cp\u003eTime series anomaly detection (AD) plays an important role in a variety of fields by identifying outliers and unusual patterns that deviate from an expected behavior in sequential data. Its use in economics (Braei \u0026amp; Wagner, \u003cspan citationid=\"CR4\" class=\"CitationRef\"\u003e2020\u003c/span\u003e), information technology (IT) (Ji et al., \u003cspan citationid=\"CR13\" class=\"CitationRef\"\u003e2021\u003c/span\u003e), healthcare (Schmidl et al., \u003cspan citationid=\"CR23\" class=\"CitationRef\"\u003e2022\u003c/span\u003e) and geospatial fields (Barba et al., \u003cspan citationid=\"CR2\" class=\"CitationRef\"\u003e2021a\u003c/span\u003e) could be used in the early detection of abnormal events, providing important information that could improve decision-making processes and the overall efficiency of many systems.\u003c/p\u003e \u003cp\u003eWithin the geospatial field, AD can be used as a tool in climate change analysis (Choi et al., \u003cspan citationid=\"CR6\" class=\"CitationRef\"\u003e2021\u003c/span\u003e), natural disaster prediction (Miau \u0026amp; Hung, \u003cspan citationid=\"CR21\" class=\"CitationRef\"\u003e2020\u003c/span\u003e) and other areas, such as GNSS data monitoring (Barba et al., \u003cspan citationid=\"CR3\" class=\"CitationRef\"\u003e2021b\u003c/span\u003e), with the latter being the focus of our work. AD in GNSS time series data could help to identify outliers and unusual patterns that could be related to abnormal events such as earthquakes and equipment changes/malfunctions (Ishikawa et al., \u003cspan citationid=\"CR12\" class=\"CitationRef\"\u003e2020\u003c/span\u003e; Jing et al., \u003cspan citationid=\"CR14\" class=\"CitationRef\"\u003e2022\u003c/span\u003e).\u003c/p\u003e \u003cp\u003eTo date, many algorithms have been developed to perform AD on time series data. These algorithms can be divided into three different groups: statistical methods (SMs), machine learning (ML) and deep learning (DL) (Lim \u0026amp; Zohren, \u003cspan citationid=\"CR18\" class=\"CitationRef\"\u003e2021\u003c/span\u003e). SMs include algorithms such as the Gaussian process (Williams \u0026amp; Rasmussen, \u003cspan citationid=\"CR28\" class=\"CitationRef\"\u003e2006\u003c/span\u003e) and Moving Average algorithms. In the ML area, the well-established Kalman filter (Verhaegen \u0026amp; Verdult, \u003cspan citationid=\"CR25\" class=\"CitationRef\"\u003e2007\u003c/span\u003e) is worth mentioning. Taking advantage of the nonlinearity provided by DL algorithms, one could mention long short-term memory (LSTM) networks (Lei et al., \u003cspan citationid=\"CR17\" class=\"CitationRef\"\u003e2024\u003c/span\u003e), variational autoencoders (VAEs) (Desai et al., \u003cspan citationid=\"CR7\" class=\"CitationRef\"\u003e2021\u003c/span\u003e) and transformer-based approaches (Ahmed et al., \u003cspan citationid=\"CR1\" class=\"CitationRef\"\u003e2022\u003c/span\u003e).\u003c/p\u003e \u003cp\u003eVitti (\u003cspan citationid=\"CR26\" class=\"CitationRef\"\u003e2012\u003c/span\u003e) used signal segmentation to detect anomalies in time series of GNSS coordinates, but the method could not handle missing data. Gazeaux et al. (\u003cspan citationid=\"CR8\" class=\"CitationRef\"\u003e2013\u003c/span\u003e) reported that most automated and semiautomated methods available at that time could not detect anomalies with lower magnitudes than manual inspection. Wu et al. (\u003cspan citationid=\"CR29\" class=\"CitationRef\"\u003e2017\u003c/span\u003e) designed software to perform anomaly detection in GNSS time series. The methods require hyperparameters that the user should interactively test. Several machine learning (Kiani, \u003cspan citationid=\"CR15\" class=\"CitationRef\"\u003e2020\u003c/span\u003e) and time series decomposition (Ghaderpour, \u003cspan citationid=\"CR9\" class=\"CitationRef\"\u003e2021\u003c/span\u003e; Lebrun et al., \u003cspan citationid=\"CR16\" class=\"CitationRef\"\u003e2021\u003c/span\u003e) approaches have been developed for anomaly detection in time series of GNSS coordinates, but none have used state-of-the-art networks.\u003c/p\u003e \u003cp\u003eRecently, considering the difficulty of mapping deeply intricate temporal dependencies in time series data, Wu et al. (\u003cspan citationid=\"CR30\" class=\"CitationRef\"\u003e2022\u003c/span\u003e) presented a novel network architecture for performing anomaly detection in such data. TimesNet is a neural network that comprises the use of convolution neural networks and Fast Fourier Transform to map long-term temporal dependencies in time series data. Their architecture was tested against many benchmark datasets, achieving state-of-the-art (SOTA) performance.\u003c/p\u003e \u003cp\u003eTherefore, considering the results obtained by TimesNet in such datasets, we propose its use to perform AD on weekly SIRGAS GNSS time series data provided by DGFI-TUM (Zhang et al., \u003cspan citationid=\"CR33\" class=\"CitationRef\"\u003e2024\u003c/span\u003e). We hypothesize that TimesNet could map the complex temporal patterns present in this kind of data, specifically, data from stations in Brazil and Ecuador. The Brazilian stations were selected for analysis because they exhibit consistent behavior related to their location in the middle of the continental South American plate, which is characterized by a low level of tectonic deformation. In contrast, Ecuadorian stations were employed because they frequently present abnormalities due to earthquakes caused by subduction at the boundaries between the Nazca Plate (oceanic) and the South American Plate.\u003c/p\u003e \u003cp\u003eTo achieve our goal, we developed a Python code to download and preprocess weekly SIRGAS GNSS time series data from the selected stations. The preprocessed data were later used to train the TimesNet model with a set of different hyperparameters that were determined with the help of a hyperparameter optimization tool called the NNI (Yu \u0026amp; Zhu, \u003cspan citationid=\"CR32\" class=\"CitationRef\"\u003e2020\u003c/span\u003e). The best models were subsequently analyzed to identify which hyperparameters play a decisive role in the overall performance of the model. The optimized parameters were used to detect anomalies at 77 SIRGAS stations in Brazil and 18 in Ecuador, which were assessed against other filtering models to verify the model efficiency.\u003c/p\u003e"},{"header":"Materials and Methods","content":"\u003cp\u003eIn this section, we describe the most relevant aspects of the TimesNet architecture, the data preparation process, the details of the neural network training process for individual GNSS stations and the performance assessment process developed in our work.\u003c/p\u003e \u003cp\u003eTimesNet\u003c/p\u003e \u003cp\u003eTimesNet operates by dividing the time series into non-overlapping windows, where each window represents a specific time period. The network is trained on these windows to learn the patterns within the data. During inference, the network generates predictions for each window. The difference between these predictions to the actual values in the windows are output as anomaly scores, where large discrepancies indicate potential anomalies.\u003c/p\u003e \u003cp\u003eTimesNet is a deep neural network designed to model the temporal variation in 1D time series data. Real-world time series data usually present multiple periods, such as daily, weekly, and yearly, which interact with each other. Therefore, the network architecture captures temporal variations in a time series by decomposing 1D data in a 2D space that can explicitly map variations both within and between periods (Fig.\u0026nbsp;\u003cspan refid=\"Fig1\" class=\"InternalRef\"\u003e1\u003c/span\u003e).\u003c/p\u003e \u003cp\u003e  \u003c/p\u003e \u003cp\u003eThis process depends on the discovery of periods present in the data. This is achieved by employing the Fast Fourier Transform (FFT). By analyzing the frequency domain of the FFT processed data, it is possible to verify that the first few peak frequencies are the most significant. Thus, to avoid noise originating from high frequencies, only the top-k frequencies are selected to determine which periods will be processed by TimesNet.\u003c/p\u003e \u003cp\u003eThis leads to the overall modular architecture of TimesNet (Fig.\u0026nbsp;\u003cspan refid=\"Fig2\" class=\"InternalRef\"\u003e2\u003c/span\u003e), which is composed of a stack of so-called TimesBlocks that are connected in a residual way. A TimesBlock receives data in 1D space and processes these data with FFT to discover the most significant periods. Each period is then transformed into a 2D space and processed by a shared inception block that makes use of 2D convolutions to capture intra/interperiod variations. Each 2D space data point is then transformed back into 1D space data through an adaptive aggregation according to their relative importance, which is determined by applying SoftMax to the output of the 2D convolutions (Fig.\u0026nbsp;\u003cspan refid=\"Fig2\" class=\"InternalRef\"\u003e2\u003c/span\u003e).\u003c/p\u003e \u003cp\u003e  \u003c/p\u003e \u003cp\u003eThe inception block used in the timesblock follows the first version published by Szegedy et al. (\u003cspan citationid=\"CR24\" class=\"CitationRef\"\u003e2014\u003c/span\u003e), which uses up to 2\u003csup\u003enum_kernels + 1\u003c/sup\u003e parallel convolution layers with different kernel sizes (e.g.: 1x1, 3x3, 5x5), is responsible for capturing temporal variations in a 2D space (interperiod-variation and intraperiod-variation) as shown in the left part of Fig.\u0026nbsp;\u003cspan refid=\"Fig1\" class=\"InternalRef\"\u003e1\u003c/span\u003e. It can be replaced by various computer vision backbones to process 2D transformed space data. Visual backbones such as ResNet (He et al., \u003cspan citationid=\"CR10\" class=\"CitationRef\"\u003e2016\u003c/span\u003e), ResNeXT (Xie et al., \u003cspan citationid=\"CR31\" class=\"CitationRef\"\u003e2016\u003c/span\u003e), ConvNeXT (Liu et al., \u003cspan citationid=\"CR20\" class=\"CitationRef\"\u003e2022\u003c/span\u003e) and attention-based models (Liu et al., \u003cspan citationid=\"CR19\" class=\"CitationRef\"\u003e2021\u003c/span\u003e) can be explored, which brings flexibility to the network and takes advantage of the developments achieved by the computer vision community (H. Wu et al., \u003cspan citationid=\"CR30\" class=\"CitationRef\"\u003e2022\u003c/span\u003e).\u003c/p\u003e \u003cp\u003eSince TimesNet was released as an open-source software, it was later adapted to some Python time series libraries. DeepOD is an open-source Python library that performs anomaly detection and outlier detection using deep learning methods, including TimesNet. The TimesNet implementation of DeepOD does not provide an early stop regularization technique. Therefore, considering the importance of such a technique, we developed an early stop function with patience and delta hyperparameters that were used in the training step of our experiments.\u003c/p\u003e \u003cp\u003eTimesNet Hyperparameters\u003c/p\u003e \u003cp\u003eThe hyperparameters necessary to train TimesNet (Table\u0026nbsp;\u003cspan refid=\"Tab1\" class=\"InternalRef\"\u003e1\u003c/span\u003e) are those originally present in the DeepOD implementation plus the patience and delta that were included by our early stop implementation.\u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"Yes\" id=\"Tab1\" border=\"1\"\u003e \u003ccaption language=\"En\"\u003e \u003cdiv class=\"CaptionNumber\"\u003eTable 1\u003c/div\u003e \u003cdiv class=\"CaptionContent\"\u003e \u003cp\u003eTimesNet hyperparameters and default values\u003c/p\u003e \u003c/div\u003e \u003c/caption\u003e \u003ccolgroup cols=\"3\"\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c1\" colnum=\"1\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c2\" colnum=\"2\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c3\" colnum=\"3\"\u003e\u003c/div\u003e \u003cthead\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\"\u003e \u003cp\u003eName\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c2\"\u003e \u003cp\u003eDefinition\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c3\"\u003e \u003cp\u003eDefault Value\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003c/thead\u003e \u003ctbody\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eseq_len\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eLength of the input sequences\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e100\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003estride\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eStride for sliding window on data\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e1\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003elr\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eLearning rate for optimizer\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e1e-4\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eepochs\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eNumber of epochs to train the model\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e10\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003ebatch_size\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eSize of batches for training\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e32\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eepoch_steps\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eNumber of steps per epoch\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e20\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003epred_len\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003ePrediction length for the model\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e0\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003ee_layers\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eNumber of TimeBlocks to stack\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e2\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003ed_model\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eDimensionality of the model (number of features generated by the data embedding)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e64\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003ed_ff\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eDimensionality of the feedforward layers (TimesBlock internal convolution dimension)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e64\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003edropout\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eDropout rate in the data embedding\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e0.1\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003etop_k\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eTop K frequencies for FFT period finding\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e5\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003enum_kernels\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eNumber of convolutional layers in the Inception Block\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e6\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003epatience\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eNumber of epochs under convergence to early stop\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e3\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003edelta\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eConvergence value for the early stopping\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e1e-7\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003epercentile\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eIs not a model hyperparameter, but is used to make predictions\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e99%\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003cp\u003eData preparation\u003c/p\u003e \u003cp\u003eSIRGAS records the GNSS observables of each continuously monitored station in the SIRGAS network. These observations are used to provide weekly solutions for the GNSS positions of each station monitored. A total of three files are made available for each station every week: NEU (north, east, and up coordinates), DSC (discontinuities) and XYZ (geocentric coordinates). The NEU local geodetic coordinates of a station represent the difference between the current week position and the first position in the time series (DN, DE, DU). The NEU file also provides the same information as the DSC file about the recorded events that could affect the time series, such as earthquakes and equipment changes/failures.\u003c/p\u003e \u003cp\u003eThe discontinuities provided by SIRGAS do not represent every possible data problem in the time series. For example, some series may be affected by missing data, leading to unreported gaps in the DSC files, and certain minor equipment changes may not affect the station's position. Therefore, our preprocessing includes the edges of data gaps such as anomalies (Fig.\u0026nbsp;\u003cspan refid=\"Fig3\" class=\"InternalRef\"\u003e3\u003c/span\u003e).\u003c/p\u003e \u003cp\u003e  \u003c/p\u003e \u003cp\u003eFor each selected station, the files are downloaded and preprocessed. The data extracted from the NEU file are used to create two CSV files that are used to train and evaluate TimesNet and the other comparison models, being the inputs used for each anomaly detection method. The first CSV file, made for training, contains the GPS week, DN, DE and DU. The second CSV file, used to assess model performance, contains the GPS week and a discontinuity label. If a recorded week contains a discontinuity, it is labeled 1; otherwise, it is labeled 0. The gaps were filled with the value 0. To represent the time series direction (from earlier to later), the first point in the gap and the first point after the gap were marked as anomaly labels.\u003c/p\u003e \u003cp\u003eSingle-station hyperparameter optimization\u003c/p\u003e \u003cp\u003eTimesNet uses some hyperparameters that can be changed to adapt the network to different time series, thus defining different models for each set of hyperparameters. To fit a set of hyperparameters to the SIRGAS time series, we performed hyperparameter optimization for two stations. Considering that each station could be subject to different tectonic influences and different conditions regarding changes/failures of equipment, we performed the training steps individually. The objective was to determine a set of hyperparameters that could be shared among others to deliver similar performance metrics.\u003c/p\u003e \u003cp\u003eTo determine the best hyperparameters, we used the Neural Network Intelligence (NNI) toolkit (Microsoft, \u003cspan citationid=\"CR22\" class=\"CitationRef\"\u003e2021\u003c/span\u003e). We defined a search space for the TimesNet hyperparameters as described in Table\u0026nbsp;\u003cspan refid=\"Tab2\" class=\"InternalRef\"\u003e2\u003c/span\u003e.\u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"Yes\" id=\"Tab2\" border=\"1\"\u003e \u003ccaption language=\"En\"\u003e \u003cdiv class=\"CaptionNumber\"\u003eTable 2\u003c/div\u003e \u003cdiv class=\"CaptionContent\"\u003e \u003cp\u003eHyperparameter search space for TimesNet.\u003c/p\u003e \u003c/div\u003e \u003c/caption\u003e \u003ccolgroup cols=\"3\"\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c1\" colnum=\"1\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c2\" colnum=\"2\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c3\" colnum=\"3\"\u003e\u003c/div\u003e \u003cthead\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\"\u003e \u003cp\u003eHP\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c2\"\u003e \u003cp\u003eSearch Space\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c3\"\u003e \u003cp\u003eRational\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003c/thead\u003e \u003ctbody\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eseq_len\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eChoice in [10, 20]\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eEmpirically determined: smaller values delivered better results for the GNSS SIRGAS stations\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003ee_layers\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eChoice in [2,3]\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eBest results according to the original paper\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003ed_model\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eChoice in [32, 64, 128]\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eBest results according to the original paper\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003ed_ff\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eChoice in [32, 64, 128]\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eThe original implementation usually uses d_ff\u0026thinsp;=\u0026thinsp;d_model\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003edropout\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eQuniform in [0.1, 0.3, 0.1]\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eEmpirically determined: using the default value as starting point at steps of 5%\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003etop_k\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eChoice in [3, 5]\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eBest result according to the original paper\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003cp\u003eIn the training step, we obtained anomaly scores for each point in the time series. Two sets of predictions were calculated based on the anomaly scores: the top 1% (percentile 1) and the top S (where S is the number of anomalies in the truth set). The top 1% prediction set marks the top 1% scores as predicted anomalies, while the top S prediction set marks the top S scores. The latter was created to avoid the effects of selecting a percentile threshold.\u003c/p\u003e \u003cp\u003eDuring the test step, the truth set and each prediction set were used to calculate the accuracy, precision, recall, F1 and MSE metrics (Chicco \u0026amp; Jurman, \u003cspan citationid=\"CR5\" class=\"CitationRef\"\u003e2020\u003c/span\u003e) to assess the performance of the model. Thus, we compared the unsupervised labels obtained from the anomaly scores against the labels determined during the preprocessing step (i.e. maintainer anomalies plus data gaps borders). The accuracy, precision, recall and F1 are calculated with the number of true positives (TPs), true negatives (TNs), false positives (FPs) and false negatives (FNs), and the MSE is calculated based on predictions and observations, as summarized in Table\u0026nbsp;\u003cspan refid=\"Tab3\" class=\"InternalRef\"\u003e3\u003c/span\u003e. We chose the MSE metric for the HPO search because it uses the anomaly scores output by the TimesNet decision function, not relying on predictions that are generated based on a percentile value.\u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"Yes\" id=\"Tab3\" border=\"1\"\u003e \u003ccaption language=\"En\"\u003e \u003cdiv class=\"CaptionNumber\"\u003eTable 3\u003c/div\u003e \u003cdiv class=\"CaptionContent\"\u003e \u003cp\u003eMetrics used and their definitions.\u003c/p\u003e \u003c/div\u003e \u003c/caption\u003e \u003ccolgroup cols=\"4\"\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c1\" colnum=\"1\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c2\" colnum=\"2\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c3\" colnum=\"3\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c4\" colnum=\"4\"\u003e\u003c/div\u003e \u003cthead\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\"\u003e \u003cp\u003eMetric\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c2\"\u003e \u003cp\u003eDescription\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c3\"\u003e \u003cp\u003eFormula\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c4\"\u003e \u003cp\u003eRemarks\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003c/thead\u003e \u003ctbody\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eAccuracy\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eDetermine the proportion of correct predictions over all samples\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e\u003cspan class=\"InlineEquation\"\u003e\u003cspan class=\"mathinline\"\u003e\\(\\:acc=\\frac{TP+TN}{TP+TN+FP+FN}\\)\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003eDoesn\u0026rsquo;t deal with class imbalance\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003ePrecision\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eDetermine the proportion of predictions that are correct\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e\u003cspan class=\"InlineEquation\"\u003e\u003cspan class=\"mathinline\"\u003e\\(\\:p=\\frac{TP}{TP+FP}\\)\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003eDisregards the number of FN that the model fails to identify\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eRecall\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eDetermine the proportion of actual positives that were correctly predicted\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e\u003cspan class=\"InlineEquation\"\u003e\u003cspan class=\"mathinline\"\u003e\\(\\:r=\\frac{TP}{TP+FN}\\)\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003eDisregards the number of FP that were incorrectly classified by the model\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eF1\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eHarmonic mean between Precision (p) and Recall (r)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e\u003cspan class=\"InlineEquation\"\u003e\u003cspan class=\"mathinline\"\u003e\\(\\:f1=\\frac{2\\left(pr\\right)}{p+r}\\)\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003eAddresses limitations of precision and recall, providing a balanced assessment for imbalanced dataset\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eMSE\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eThe mean-square error between observed and\u0026nbsp;predicted values\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e\u003cspan class=\"InlineEquation\"\u003e\u003cspan class=\"mathinline\"\u003e\\(\\:mse=\\:\\frac{1}{n}\\sum\\:_{i=1}^{n}{({o}_{i}-{p}_{i})}^{2}\\)\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003eLarger errors are punished more heavily than smaller errors.\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003cp\u003eAs the F1\u003csub\u003etopS\u003c/sub\u003e is calculated using the top S predicted labels, for each FP labeled there is a FN label, which makes FP equal to FN. This ultimately makes Precision\u003csub\u003etopS\u003c/sub\u003e, Recall\u003csub\u003etopS\u003c/sub\u003e and F1\u003csub\u003etopS\u003c/sub\u003e equal. Therefore, we only present F1\u003csub\u003etopS\u003c/sub\u003e in the metrics table.\u003c/p\u003e \u003cp\u003eMultiple-station assessment\u003c/p\u003e \u003cp\u003eTo assess the overall performance of TimesNet in detecting anomalies across all the selected stations (77 from Brazil and 18 from Ecuador), we developed a procedure to evaluate its general effectiveness.\u003c/p\u003e \u003cp\u003eThe single-station training procedure was used to obtain optimized hyperparameters for two selected stations that presented visually distinct behaviors, notably, stations such as BRAZ and CHEC. Stations such as the BRAZ exhibit more consistent behavior, with smaller discontinuities normally originating from equipment changes or jumps in some of the positional components (i.e., jumps in N or E). Stations such as the CHEC present large discontinuities due to earthquakes, such as the 2016 Pedernales/Ecuador earthquake (Mw7.8) and the 2019 Palora/Ecuador earthquake (Mw7.5) registered at this station.\u003c/p\u003e \u003cp\u003eWe evaluated the differences between the hyperparameters obtained with BRAZ and those obtained with CHEC. Therefore, the optimized hyperparameters obtained for each station were used in a global training process, which essentially included a single-station training procedure to obtain the predictions for each station used in our research. The predictions and labels of each station are then stacked to calculate the global metrics. TimesNet and the other comparison models produce an anomaly score for each point in the input series as outputs from each model. Higher scores indicate a greater chance that the point is an anomaly. Building on the previously described performance metrics (Table\u0026nbsp;\u003cspan refid=\"Tab3\" class=\"InternalRef\"\u003e3\u003c/span\u003e), during the prediction step, anomaly scores in the top 1% percentile are labeled anomalies, while anomaly scores under the percentile parameter are labeled normal.\u003c/p\u003e \u003cp\u003eComparisons with other models\u003c/p\u003e \u003cp\u003eWe performed multiple-station assessments with other well-known models to compare the results obtained with those of TimesNet. We used the DARTS library (Herzen et al., \u003cspan citationid=\"CR11\" class=\"CitationRef\"\u003e2022\u003c/span\u003e) and selected the following available anomaly detection filters: Kalman (Verhaegen \u0026amp; Verdult, \u003cspan citationid=\"CR25\" class=\"CitationRef\"\u003e2007\u003c/span\u003e), Gaussian process (Williams \u0026amp; Rasmussen, \u003cspan citationid=\"CR28\" class=\"CitationRef\"\u003e2006\u003c/span\u003e) and Moving Average. Additionally, we selected a LSTM neural network forecaster from DARTS library, using the hyperparameters that achieved the best results for GNSS coordinates time series forecast as stated by Wang et al. (\u003cspan citationid=\"CR27\" class=\"CitationRef\"\u003e2021\u003c/span\u003e). These models were paired with three anomaly scorer methods (e.g., Norm, K-means and Difference). Each filter was tested with each scorer method on every station in both datasets.\u003c/p\u003e"},{"header":"Results and discussion","content":"\u003cp\u003eSingle-station hyperparameter optimization results\u003c/p\u003e \u003cp\u003eOur experiments started with a single-station training process with two stations, one from Brazil (BRAZ) and the other from Ecuador (CHEC). For each station, NNI was set to perform up to 50 experiments with different hyperparameter combinations drawn from the search space shown in Table\u0026nbsp;\u003cspan refid=\"Tab2\" class=\"InternalRef\"\u003e2\u003c/span\u003e. The hyperparameters with optimal performance after optimization were used to define two TimesNet models that were used in our experiments. The results are presented in Table\u0026nbsp;\u003cspan refid=\"Tab4\" class=\"InternalRef\"\u003e4\u003c/span\u003e.\u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"Yes\" id=\"Tab4\" border=\"1\"\u003e \u003ccaption language=\"En\"\u003e \u003cdiv class=\"CaptionNumber\"\u003eTable 4\u003c/div\u003e \u003cdiv class=\"CaptionContent\"\u003e \u003cp\u003eHyperparameter optimization results.\u003c/p\u003e \u003c/div\u003e \u003c/caption\u003e \u003ccolgroup cols=\"3\"\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c1\" colnum=\"1\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c2\" colnum=\"2\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c3\" colnum=\"3\"\u003e\u003c/div\u003e \u003cthead\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\"\u003e \u003cp\u003eHyperparameters\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c2\"\u003e \u003cp\u003eBRAZ\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c3\"\u003e \u003cp\u003eCHEC\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003c/thead\u003e \u003ctbody\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eseq_len\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e10\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e10\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003ee_layers\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e2\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e3\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003ed_model\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e128\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e64\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003ed_ff\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e32\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e128\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003edropout\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e0.3\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e0.4\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003etop_k\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e4\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e5\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eMSE\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e0.0064\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e0.0140\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003cp\u003eThe combination of the top hyperparameters (e.g., the hyperparameter set that achieved the best performance over all 50 experiments) generated by the HPO for BRAZ generated a TimesNet model with two TimesBlocks that was able to reach a MSE of 0.0064.\u003c/p\u003e \u003cp\u003eConversely, the top hyperparameter combination generated by the HPO made with CHEC generated a TimesNet model with three TimesBlocks that was able to reach a MSE of 0.0140. It is worth highlighting that for CHEC, the model demanded a d_ff hyperparameter four times larger than BRAZ to achieve its best result.\u003c/p\u003e \u003cp\u003eMultiple-station assessment results\u003c/p\u003e \u003cp\u003eTo assess the effect of using either hyperparameter set found in the single-station experiment to perform anomaly detection in GNSS time series data, we executed multiple-station assessments at all selected stations in Brazil and Ecuador separately, exchanging the optimized hyperparameters obtained for BRAZ and CHEC. Table\u0026nbsp;\u003cspan refid=\"Tab5\" class=\"InternalRef\"\u003e5\u003c/span\u003e contains the metrics obtained with both hyperparameter sets (trained on CHEC and BRAZ) using both datasets (Brazil and Ecuador).\u003c/p\u003e \u003cp\u003eLeveraging the best hyperparameters, we trained two TimesNet models to generate anomaly predictions for each station. TimesNet produces an anomaly score for each point in the input series. Higher scores indicate a greater chance that the point is an anomaly. During the prediction step, anomaly scores in the top 1% percentile are labeled anomalies, while anomaly scores under the percentile parameter are labeled normal.\u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"Yes\" id=\"Tab5\" border=\"1\"\u003e \u003ccaption language=\"En\"\u003e \u003cdiv class=\"CaptionNumber\"\u003eTable 5\u003c/div\u003e \u003cdiv class=\"CaptionContent\"\u003e \u003cp\u003eGlobal metrics calculated with exchanged hyperparameters with full processing time (training\u0026thinsp;+\u0026thinsp;inference).\u003c/p\u003e \u003c/div\u003e \u003c/caption\u003e \u003ccolgroup cols=\"5\"\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c1\" colnum=\"1\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c2\" colnum=\"2\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c3\" colnum=\"3\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c4\" colnum=\"4\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c5\" colnum=\"5\"\u003e\u003c/div\u003e \u003cthead\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\" morerows=\"1\" rowspan=\"2\"\u003e \u003cp\u003eHPO station\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colspan=\"2\" nameend=\"c3\" namest=\"c2\"\u003e \u003cp\u003eBrazil\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colspan=\"2\" nameend=\"c5\" namest=\"c4\"\u003e \u003cp\u003eEcuador\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c2\"\u003e \u003cp\u003eBRAZ\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c3\"\u003e \u003cp\u003eCHEC\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c4\"\u003e \u003cp\u003eBRAZ\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c5\"\u003e \u003cp\u003eCHEC\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003c/thead\u003e \u003ctbody\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eAccuracy (%)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e98.71\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e\u003cb\u003e98.81\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c4\"\u003e \u003cp\u003e\u003cb\u003e98.08\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c5\"\u003e \u003cp\u003e97.99\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003ePrecision (%)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e55.96\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e\u003cb\u003e60.63\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c4\"\u003e \u003cp\u003e\u003cb\u003e73.47\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c5\"\u003e \u003cp\u003e69.39\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eRecall (%)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e42.06\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e\u003cb\u003e45.58\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c4\"\u003e \u003cp\u003e\u003cb\u003e32.73\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c5\"\u003e \u003cp\u003e30.91\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eF1\u003csub\u003e1%\u003c/sub\u003e (%)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e48.03\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e\u003cb\u003e52.04\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c4\"\u003e \u003cp\u003e\u003cb\u003e45.28\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c5\"\u003e \u003cp\u003e42.77\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eF1\u003csub\u003etopS\u003c/sub\u003e (%)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e51.47\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e\u003cb\u003e55.67\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c4\"\u003e \u003cp\u003e62.73\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c5\"\u003e \u003cp\u003e\u003cb\u003e63.64\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eMSE\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e0.0099\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e\u003cb\u003e0.0095\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c4\"\u003e \u003cp\u003e\u003cb\u003e0.0145\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c5\"\u003e \u003cp\u003e\u003cb\u003e0.0145\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eTime (s)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e\u003cb\u003e822.55\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e1467.57\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c4\"\u003e \u003cp\u003e\u003cb\u003e90.97\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c5\"\u003e \u003cp\u003e197.04\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003cp\u003eThe differences between the results obtained with both hyperparameter sets were not greater than 5%. The precision, recall and F1\u003csub\u003e1%\u003c/sub\u003e metrics were greater in Brazil than in Ecuador, with a greater percentage of anomalies detected with anomaly scores in the top 1% quantile. The F1\u003csub\u003etopS\u003c/sub\u003e metric provides a percentage of how many discontinuities each model found compared to the number of discontinuities in the labeled data. In the Brazil dataset, more than 55% of the discontinuities were found by the networks, while more than 63% were found in the Ecuador dataset. This means that TimesNet was able to detect most of the anomalies at the Ecuadorian stations but misclassified higher anomaly scores (recall 45.58% in Brazil and 32.73% in Ecuador). This is probably because effects of an earthquake in the weekly time series might not occur on the first week after the event, so the method produced labels on the part of the time series where the coordinates began to change. This could be improved with better models for the earthquake effects for labeled data.\u003c/p\u003e \u003cp\u003eComparisons with other models\u003c/p\u003e \u003cp\u003eMultiple-station results with DARTS methods are presented along with TimesNet results to aid comparisons. Table\u0026nbsp;\u003cspan refid=\"Tab6\" class=\"InternalRef\"\u003e6\u003c/span\u003e presents the results of multiple-station processing for the 77 stations in Brazil. It is possible to observe that TimesNet obtained the second place in all the metrics, remaining only behind Kalman with the Norm scorer.\u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"Yes\" id=\"Tab6\" border=\"1\"\u003e \u003ccaption language=\"En\"\u003e \u003cdiv class=\"CaptionNumber\"\u003eTable 6\u003c/div\u003e \u003cdiv class=\"CaptionContent\"\u003e \u003cp\u003eBrazilian station results: Metric values for Gaussian, Kalman, Moving Average and LSTM with Norm, K-means and Difference scores side by side with TimesNet with full processing time (training\u0026thinsp;+\u0026thinsp;inference).\u003c/p\u003e \u003c/div\u003e \u003c/caption\u003e \u003ccolgroup cols=\"8\"\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c1\" colnum=\"1\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c2\" colnum=\"2\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c3\" colnum=\"3\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c4\" colnum=\"4\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c5\" colnum=\"5\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c6\" colnum=\"6\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c7\" colnum=\"7\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c8\" colnum=\"8\"\u003e\u003c/div\u003e \u003cthead\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\ olname=\"c4\"\u003e \u003cp\u003e-84.27\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c5\"\u003e \u003cp\u003e\u003cb\u003e35.39\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c6\"\u003e \u003cp\u003e1467.57\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c7\"\u003e \u003cp\u003e-1432.18\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003cp\u003eFor Ecuador, it is possible to observe that the absolute difference stays under 5% for all percentage metrics. For Brazil, it is possible to observe that the absolute difference stays under 2% for all percentage metrics. Similarly, the absolute MSE difference is 0.0001 for Brazil and 0.02 for Ecuador. The difference in MSE shows that the anomaly scores produced by TimesNet are more accurate, with peaks in the labels and values near zero in points that are not predicted as anomalies.\u003c/p\u003e \u003cp\u003eIt is possible to observe that the differences are lower for the Brazilian stations, which tend to present more consistent behavior. Conversely, for the stations in Ecuador that tend to experience larger discontinuities due to earthquakes, the differences are greater.\u003c/p\u003e \u003cp\u003eAdditionally, considering that Brazil has 77 stations and Ecuador has 18 stations, it is possible that the differences between TimesNet and the Kalman/Norm implementation for DARTS could decrease as the number of stations used in the multiple-station assessment increases.\u003c/p\u003e \u003cp\u003eVisual assessment of the results\u003c/p\u003e \u003cp\u003eThe outputs of the training process at BRAZ and CHEC stations were plotted to aid in the visual assessment of model performance. The predictions and scores output by TimesNet are overlaid on the time series data and the registered discontinuities to provide a combined view of the input data and the predicted results. The plots depict registered discontinuities as vertical black dotted lines for reference, and the predicted anomaly labels are represented by red vertical lines. Figure\u0026nbsp;\u003cspan refid=\"Fig4\" class=\"InternalRef\"\u003e4\u003c/span\u003e shows the plot for the BRAZ station.\u003c/p\u003e \u003cp\u003e  \u003c/p\u003e \u003cp\u003eFor BRAZ, TimesNet was able to accurately detect most of the anomalous regions present in the time series. It is possible to see score spikes in the regions that are related to antenna and receiver changes registered in this station\u0026rsquo;s NEU file. On the other hand, the network did not present score peaks for the first three anomalies, which can indicate that those anomalies did not generate sufficiently strong deviations from the expected pattern for this time series.\u003c/p\u003e \u003cp\u003eFor the CHEC station, the resulting plot (Fig.\u0026nbsp;\u003cspan refid=\"Fig7\" class=\"InternalRef\"\u003e7\u003c/span\u003e) shows that TimesNet correctly presented score spikes in the regions related to the 2016 Pedernales/Ecuador earthquake (Mw7.8) and the 2019 Palora/Ecuador earthquake (Mw7.5) in the regions related to antenna change and in the data gaps. Most of the spikes were not selected as anomalies due to the 99% percentile value.\u003c/p\u003e \u003cp\u003e  \u003c/p\u003e \u003cp\u003eTo better assess the performance of TimesNet, we performed AD on the same stations using Kalman/Norm scorer because it outperformed TimesNet. The results can be found in Fig.\u0026nbsp;\u003cspan refid=\"Fig6\" class=\"InternalRef\"\u003e6\u003c/span\u003e and Fig.\u0026nbsp;\u003cspan refid=\"Fig7\" class=\"InternalRef\"\u003e7\u003c/span\u003e.\u003c/p\u003e \u003cp\u003e  \u003c/p\u003e \u003cp\u003eThe anomaly scores provided by the Kalman filter with Norm scorer increase after the anomaly score peaks. This could be an issue because only the peaks are anomalies, and the points near them might be labeled anomalies depending on the quantile percentage chosen. Additionally, Kalman presented score spikes in two out of the first four anomalies (i.e., the 2nd and 3rd anomalies referring to antenna changes) that were not selected as anomalies due to the threshold value.\u003c/p\u003e \u003cp\u003e  \u003c/p\u003e \u003cp\u003eUnlike the anomaly scores obtained at the BRAZ station, the Kalman filter with the Norm scorer shows different patterns at the CHEC station. The anomaly scores increase until the data gap occurs near week 1900. Many points that are not anomalous received have anomaly scores above average before week 1900, reaching values higher than those of the previously labeled anomalies. This is undesirable because a higher threshold would incorrectly label points as anomalies. TimesNet presented a narrower distribution near the peaks, which suggests that it would be more accurate with higher percentile thresholds. The first four labels in CHEC illustrate why TimesNet obtained a higher F1\u003csub\u003etopS\u003c/sub\u003e (63.64%) than did Kalman/Norm (59.09%) at Ecuador stations, even though TimesNet achieved a worse F1\u003csub\u003e1%\u003c/sub\u003e score (45.28% and 47.80%, respectively).\u003c/p\u003e"},{"header":"Conclusion","content":"\u003cp\u003eIn this paper, we presented a complete process to download and preprocess real SIRGAS GNSS time series data that were later used as datasets in our anomaly detection implementation. We presented the concepts and overall architecture of TimesNet and compared the results obtained from it against three filtering models (Gaussian, Kalman and Moving Average) and a LSTM forecaster. We concluded that even though TimesNet obtained similar or better anomaly scores (measured by the MSE and F1\u003csub\u003etopS\u003c/sub\u003e) on real data, the classification results with the 1% percentile threshold were lower than Kalman/Norm scorer implementation provided by DARTS, achieving second place among the tested models.\u003c/p\u003e \u003cp\u003eA hyperparameter optimization tool was used to tune TimesNet to achieve nearly optimal performance at two stations, according to our experiments. These optimized hyperparameters were used to train TimesNet against all selected stations (77 from Brazil and 18 from Ecuador). The combined results were assessed against the DARTS filtering models, which showed that TimesNet was outperformed by Kalman filter with the Norm scorer implementation provided by DARTS by a considerably small margin.\u003c/p\u003e \u003cp\u003eBoth models achieved good results on real data. Additionally, it was possible to visually assess that the anomaly scores output from TimesNet presented peaks at registered anomalies that were not selected as predictions due to the threshold value used (99%). TimesNet obtained the best F1\u003csub\u003eTop S\u003c/sub\u003e score in the Ecuador dataset, so it obtained the best results in series with more anomalous patterns. The lower MSE and visual inspection of the anomaly scores in the graphs suggests that TimesNet scores tend to fluctuate less than Kalman scores, which can make it less affected by the threshold value.\u003c/p\u003e \u003cp\u003eBoth models presented peaks at the data gaps, showing that the decision to create anomalies in such gaps was correct according to our experimental analysis. This measure was able to improve model performance for all tested solutions. Future work could improve the procedure that assigns labels for earthquakes, providing a better model for when the coordinates begin to change.\u003c/p\u003e \u003cp\u003eIn terms of processing time, TimesNet required considerably more processing time (i.e., hundreds of seconds) than did Kalman, which was able to process stations from both Brazil and Ecuador in a few minutes. We suggest starting future work by comparing the Kalman filter as the base model, as it is fast and achieves the best metrics in our datasets. It would be beneficial to include globally distributed stations in future research, considering our focus on stations in Brazil and Ecuador. Additionally, we recommend using the procedure presented here with various time series, including those generated daily.\u003c/p\u003e \u003cp\u003eConsidering that our work was performed only at stations in Brazil and Ecuador, we propose, as future work, the use of stations from other countries. We also propose the use of the procedure presented here with different time series, such as those provided by the NGL.\u003c/p\u003e \u003cp\u003eFinally, we conclude that our preprocessing algorithm can be used to create real-world benchmark datasets for anomaly detection in GNSS data. Additionally, to foster future research, we offer a GitHub page with our scripts that can be promptly used at any SIRGAS station, demanding the creation of a text file containing the names of the stations to be processed.\u003c/p\u003e"},{"header":"Author Biographies","content":"\u003cdiv class=\"Biography\"\u003e \u003cp\u003e  \u003cp\u003e \u003cb\u003eLuiz Claudio Oliveira de Andrade\u003c/b\u003e received his B.Sc. degree in Cartographic Engineering in 2005 at the Military Institute of Engineering (IME). Postgraduate Diploma in Systems Engineering in 2011 at the Brazilian Open Superior School (ESAB). Postgraduate Diploma in Geoinformatics in 2014 at the Faculty of Geo-Information Science and Earth Observation of the University of Twente (ITC). M.Sc. in Applied Geosciences in 2018 at the University of Bras\u0026iacute;lia (UnB). In 2022. he was assigned as Professor/Military Advisor by the Brazilian Army to the University of the Armed Forces (ESPE) in Ecuador. where he is lecturing Geospatial Databases and researching topics related to Deep Learning.\u003c/p\u003e \u003c/p\u003e \u003c/div\u003e \u003cdiv class=\"Biography\"\u003e \u003cp\u003e \u003cb\u003eMaur\u0026iacute;cio Carvalho Mathias de Paulo\u003c/b\u003e received his B.Sc. degree in Cartographic Engineering in 2007 at the Military Institute of Engineering (IME). M.Sc. in Remote Sensing in 2013 at the National Institute for Space Research (INPE) and Ph.D. in Defense Engineering at the IME in 2024. His current research is in Deep Learning for predicting ionospheric effects on GNSS signals.\u003c/p\u003e \u003c/p\u003e \u003c/div\u003e \u003cp\u003e \u003cb\u003eHaroldo Antonio Marques\u003c/b\u003e received his B.Sc. degree in Cartographic Engineering in 2005. M.Sc. in Cartographic Science in 2008 and Ph.D. in Cartopraphic Science in 2012 at S\u0026atilde;o Paulo State University (UNESP). Presidente Prudente in Brazil. Since 2016. he is a Professor at the Cartographic Engineering Section of the Military Institute of Engineering (IME) at Rio de Janeiro in Brazil. where he is lecturing and researching topics related to Geodesy and Adjustment. especially those related to GNSS. Surveying. and Atmospheric Sciences.\u003c/p\u003e"},{"header":"Declarations","content":"\u003cp\u003e \u003ch2\u003eEthics approval and consent to participate\u003c/h2\u003e \u003cp\u003eNot applicable.\u003c/p\u003e \u003c/p\u003e\u003ch2\u003eFunding\u003c/h2\u003e \u003cp\u003eL.C.O. de Andrade is currently assigned as Professor/Military Advisor by the Brazilian Army to the University of the Armed Forces of Ecuador (ESPE). M.C.M de Paulo is funded by Military Institute of Engineering (IME) of the Brazilian Army, at CMLabIME Project - Creation and Modernization of Laboratories at the Military Engineering Institute (FINEP Agreement No. 0122031900 - Ref. 0160/22). H.A. Marques (grant 431559/2018-0) is funded by CNPq.The authors have no competing interests to declare that are relevant to the content of this article.\u003c/p\u003e\u003ch2\u003eAuthor Contribution\u003c/h2\u003e\u003cp\u003eAll authors contributed to the study conception and design. Material preparation, data collection and analysis were performed by L.C.O. de Andrade and M.C.M. de Paulo. The first draft of the manuscript was written by L.C.O. de Andrade and all authors commented on previous versions of the manuscript. All authors read and approved the final manuscript.\u003c/p\u003e\u003ch2\u003eAcknowledgement\u003c/h2\u003e\u003cp\u003eThe authors thank DGFI-TUM for the publicly available GNSS time series files (e.g., NEU, dsc and XYZ). The authors would like to thank the Brazilian Army and Brazilian National Council for Scientific and Technological Development (CNPq).L.C.O. de Andrade is currently assigned as Professor/Military Advisor by the Brazilian Army to the University of the Armed Forces of Ecuador (ESPE). M.C.M de Paulo is funded by Military Institute of Engineering (IME) of the Brazilian Army, at CMLabIME Project - Creation and Modernization of Laboratories at the Military Engineering Institute (FINEP Agreement No. 0122031900 - Ref. 0160/22). H.A. Marques (grant 431559/2018-0) is funded by CNPq.\u003c/p\u003e\u003ch2\u003eData Availability\u003c/h2\u003e\u003cp\u003eCode and data were released in the GitHub address https://github.com/mauriciodev/deep_anomaly_gnss to provide repeatability and reproducibility, while also providing new tools for the geodesy researchers.\u003c/p\u003e"},{"header":"References","content":"\u003col\u003e\u003cli\u003e\u003cspan\u003eAhmed S, Nielsen IE, Tripathi A, Siddiqui S, Rasool G, Ramachandran RP (2022) Transformers in Time-series Analysis: A Tutorial. \u003cspan class=\"ExternalRef\"\u003e\u003cspan class=\"RefSource\"\u003ehttps://doi.org/10.1007/s00034-023-02454-8\u003c/span\u003e\u003cspan address=\"10.1007/s00034-023-02454-8\" targettype=\"DOI\" class=\"RefTarget\"\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eBarba P, Rosado B, Ram\u0026iacute;rez-Zelaya J, Berrocoso M (2021a) Comparative Analysis of Statistical and Analytical Techniques for the Study of GNSS Geodetic Time Series. \u003cem\u003eThe 7th International Conference on Time Series and Forecasting\u003c/em\u003e, 21. \u003cspan class=\"ExternalRef\"\u003e u003cli\u003e\u003cspan\u003eVitti A (2012) Sigseg: a tool for the detection of position and velocity discontinuities in geodetic time-series. GPS Solutions 16(3):405\u0026ndash;410. \u003cspan class=\"ExternalRef\"\u003e\u003cspan class=\"RefSource\"\u003ehttps://doi.org/10.1007/s10291-012-0257-9\u003c/span\u003e\u003cspan address=\"10.1007/s10291-012-0257-9\" targettype=\"DOI\" class=\"RefTarget\"\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eWang J, Jiang W, Li Z, Lu Y (2021) A New Multi-Scale Sliding Window LSTM Framework (MSSW-LSTM): A Case Study for GNSS Time-Series Prediction. Remote Sens 13(16):3328. \u003cspan class=\"ExternalRef\"\u003e\u003cspan class=\"RefSource\"\u003ehttps://doi.org/10.3390/rs13163328\u003c/span\u003e\u003cspan address=\"10.3390/rs13163328\" targettype=\"DOI\" class=\"RefTarget\"\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eWilliams CKI, Rasmussen CE (2006) Gaussian processes for machine learning, vol 2. MIT press Cambridge, MA, 3\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eWu D, Yan H, Shen Y (2017) TSAnalyzer, a GNSS time series analysis software. GPS Solutions 21(3):1389\u0026ndash;1394. \u003cspan class=\"ExternalRef\"\u003e\u003cspan class=\"RefSource\"\u003ehttps://doi.org/10.1007/s10291-017-0637-2\u003c/span\u003e\u003cspan address=\"10.1007/s10291-017-0637-2\" targettype=\"DOI\" class=\"RefTarget\"\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eWu H, Hu T, Liu Y, Zhou H, Wang J, Long M (2022) TimesNet: Temporal 2D-Variation Modeling for General Time Series Analysis. \u003cspan class=\"ExternalRef\"\u003e\u003cspan class=\"RefSource\"\u003ehttps://arxiv.org/abs/2210.02186\u003c/span\u003e\u003cspan address=\"https://arxiv.org/abs/2210.02186\" targettype=\"URL\" class=\"RefTarget\"\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eXie S, Girshick R, Doll\u0026aacute;r P, Tu Z, He K (2016) Aggregated Residual Transformations for Deep Neural Networks\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eYu T, Zhu H (2020) Hyper-Parameter Optimization: A Review of Algorithms and Applications\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eZhang J, Huang C, Lian L, Zhang S (2024) Assessment of the Improvement in Observation Precision of GNSS, SLR, VLBI, and DORIS Inputs from ITRF2014 to ITRF2020 Using TRF Stacking Methods. Remote Sens 16(7):1240. \u003cspan class=\"ExternalRef\"\u003e\u003cspan class=\"RefSource\"\u003ehttps://doi.org/10.3390/rs16071240\u003c/span\u003e\u003cspan address=\"10.3390/rs16071240\" targettype=\"DOI\" class=\"RefTarget\"\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/li\u003e\u003c/ol\u003e"}],"fulltextSource":"","fullText":"","funders":[],"hasAdminPriorityOnWorkflow":false,"hasManuscriptDocX":true,"hasOptedInToPreprint":true,"hasPassedJournalQc":"","hasAnyPriority":false,"hideJournal":false,"highlight":"","institution":"","isAcceptedByJournal":true,"isAuthorSuppliedPdf":false,"isDeskRejected":"","isHiddenFromSearch":false,"isInQc":false,"isInWorkflow":false,"isPdf":false,"isPdfUpToDate":true,"isWithdrawnOrRetracted":false,"journal":{"display":true,"email":"info@researchsquare.com","identity":"gps-solutions","isNatureJournal":false,"hasQc":true,"allowDirectSubmit":false,"externalIdentity":"gpss","sideBox":"Learn more about [GPS Solutions](http://link.springer.com/journal/10291)","snPcode":"10291","submissionUrl":"https://submission.nature.com/new-submission/10291/3","title":"GPS Solutions","twitterHandle":"","acdcEnabled":true,"dfaEnabled":true,"editorialSystem":"em","reportingPortfolio":"Springer Hybrid","inReviewEnabled":true,"inReviewRevisionsEnabled":false},"keywords":"GNSS Time Series, Anomaly Detection, Deep Learning, TimesNet, Hyperparameter Optimization, Kalman","lastPublishedDoi":"10.21203/rs.3.rs-4460921/v1","lastPublishedDoiUrl":"https://doi.org/10.21203/rs.3.rs-4460921/v1","license":{"name":"CC BY 4.0","url":"https://creativecommons.org/licenses/by/4.0/"},"manuscriptAbstract":"\u003cp\u003eTime series anomaly detection is essential in a range of fields because it allows for the identification of atypical patterns that differ from the expected behavior. Time series data of GNSS coordinates of SIRGAS stations are valuable for research purposes, including the determination of tectonic drift (velocity) and strain rate deformation. Changes in the patterns of a GNSS time series at a station due to abnormal events such as earthquakes, equipment changes, or malfunctions can significantly impact the accuracy of velocity estimation. In this work, we assess the efficacy of a neural network called TimesNet for detecting anomalies in real GNSS time series data from 95 SIRGAS stations in Brazil and Ecuador. As TimesNet achieved state-of-the-art efficiency on many benchmark datasets, it was chosen as the primary model for this research. Hyperparameter optimization was employed for TimesNet using two stations: BRAZ, in a low seismic activity area in Brazil, and CHEC in a high seismic activity area in Ecuador. The results with both hyperparameters sets were compared against three established anomaly detection filters (Gaussian process, Kalman and Moving Average) and a LSTM neural network that were paired with three anomaly scorer methods (norm, K-means and difference). We tested two methods to predict labels from the anomaly scores: 1) Using a fixed percentile (Top 1%) threshold, and 2) Using the Top S scores, where S is the number of anomalies of each station. The TimesNet with hyperparameters optimized in the CHEC station obtained better results than BRAZ, both in Brazil and Ecuador stations, showing that the choice of hyperparameters may present an impact in the anomaly detection results. The best F1\u003csub\u003eTop S\u003c/sub\u003e and MSE in Brazil were obtained with the Kalman filter (F1\u003csub\u003eTop S\u003c/sub\u003e=57.60 | MSE\u0026thinsp;=\u0026thinsp;0.0094), closely followed by TimesNet (F1\u003csub\u003eTop S\u003c/sub\u003e=55.67 | MSE\u0026thinsp;=\u0026thinsp;0.0095). In Ecuador, the best F1\u003csub\u003eTop S\u003c/sub\u003e and MSE were obtained by TimesNet (F1\u003csub\u003eTop S\u003c/sub\u003e=63.64 | MSE\u0026thinsp;=\u0026thinsp;0.0145), followed by the Kalman filter (F1\u003csub\u003eTop S\u003c/sub\u003e=59.09 | MSE\u0026thinsp;=\u0026thinsp;0.0344). Therefore, the anomaly scores produced by TimesNet were less noisy than those produced by the other methods on Ecuador. To foster further research, the source code for this analysis is publicly available at \u003cspan class=\"ExternalRef\"\u003e\u003cspan class=\"RefSource\"\u003ehttps://github.com/mauriciodev/deep_anomaly_gnss\u003c/span\u003e\u003cspan address=\"https://github.com/mauriciodev/deep_anomaly_gnss\" targettype=\"URL\" class=\"RefTarget\"\u003e\u003c/span\u003e\u003c/span\u003e.\u003c/p\u003e","manuscriptTitle":"Anomaly Detection in weekly SIRGAS GNSS Time Series: A TimesNet assessment in real data","msid":"","msnumber":"","nonDraftVersions":[{"code":1,"date":"2024-11-15 17:25:35","doi":"10.21203/rs.3.rs-4460921/v1","editorialEvents":[{"type":"communityComments","content":0},{"type":"decision","content":"Accepted","date":"2025-02-28T19:03:15+00:00","index":"","fulltext":""},{"type":"editorInvitedReview","content":"","date":"2025-02-28T17:46:43+00:00","index":"hide","fulltext":""},{"type":"reviewerAgreed","content":"332616907910294646168438637759618147583","date":"2025-02-02T10:27:27+00:00","index":"hide","fulltext":""},{"type":"editorInvitedReview","content":"","date":"2024-10-17T05:05:05+00:00","index":"hide","fulltext":""},{"type":"reviewerAgreed","content":"127920865427218574969677868946195492197","date":"2024-09-19T07:55:56+00:00","index":"hide","fulltext":""},{"type":"reviewersInvited","content":"","date":"2024-09-18T09:43:1
