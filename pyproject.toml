[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gnss-anomaly-agent"
version = "0.1.0"
description = "GNSS offline anomaly experiments and lightweight tool selection"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.9,<4",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
gnss-exp = "gnss_anomaly.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gnss_anomaly"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
