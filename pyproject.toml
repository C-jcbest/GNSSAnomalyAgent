[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gnss-vlm-research"
version = "0.1.0"
description = "Auditable visual and numerical GNSS anomaly experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2",
  "pydantic>=2.10,<3",
  "matplotlib>=3.10,<4",
  "httpx>=0.28,<1",
  "ruptures==1.1.10",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
gnss-research = "gnss_research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gnss_research"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
